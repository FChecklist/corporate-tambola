<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="color-scheme" content="light">
<title>Game log | Corporate Tambola</title>
<link rel="stylesheet" href="/fonts.css">
<style>
body{font:16px/1.5 Inter,system-ui,sans-serif;margin:0;background:#fff;color:#1a1a1a}
main{max-width:860px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.6rem;margin:.2em 0}h2{font-size:1.15rem;margin:1.4em 0 .4em;border-bottom:2px solid #0b3d91;padding-bottom:2px}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #d6d6d6;padding:5px 8px;text-align:left;vertical-align:top}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.bar button{font:600 1rem Inter,system-ui,sans-serif;min-height:48px;padding:8px 20px;border-radius:10px;border:2px solid #0b3d91;background:#0b3d91;color:#fff;cursor:pointer}
.bar button.alt{background:#fff;color:#0b3d91}.note{color:#444;font-size:.92rem}.nums{columns:2;column-gap:32px;font-variant-numeric:tabular-nums}
.nums div{break-inside:avoid;padding:1px 0}.big{font-size:1.1rem}
@media print{.bar,.noprint{display:none}main{max-width:none;padding:0}body{font-size:12px}}
</style>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0B3D91"></head><body>
<main id="app" aria-live="polite"><p>Loading…</p></main>
<script src="/zgame.js"></script><script src="/gamelog.js"></script>
</body></html>
