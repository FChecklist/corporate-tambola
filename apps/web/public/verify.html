<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Check a certificate | Corporate Tambola</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/site.css">
</head><body>
<main style="max-width:640px;margin:0 auto;padding:24px 16px;font-family:system-ui,sans-serif;color:#1a2233">
<h1 style="font-size:1.4rem">Check a certificate</h1>
<p>Type or open the certificate number to see whether it is real. The record never holds a name, mobile number or e-mail.</p>
<form id="f" style="margin:12px 0"><label for="c">Certificate number</label><br>
<input id="c" name="c" autocomplete="off" style="min-height:44px;font-size:1rem;width:70%;max-width:320px" maxlength="40">
<button type="submit" style="min-height:44px;padding:6px 16px">Check</button></form>
<div id="out" role="status" aria-live="polite"></div>
</main>
<script src="/verify.js"></script>
</body></html>
