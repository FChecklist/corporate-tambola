# The scheduled job of Corporate Tambola (free plan). Deploy:  bun x wrangler@3 deploy  (from this folder), then set the secret:  wrangler secret put CRON_KEY
name = "corporate-tambola-cron"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[triggers]
crons = ["* * * * *"]   # every minute: bounded work per call, safe to repeat

[vars]
TARGET = "https://corporate-tambola.pages.dev"
