# Corporate Tambola on Cloudflare Pages + Functions + D1: free plan only, no custom domain (https://corporatetambola.com).
# Deploy with:  bun run pages:deploy   (see README.md in this folder). Secrets are NOT in this file.
name = "corporate-tambola"
pages_build_output_dir = "public"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]   # billing uses node:crypto HMAC

[[d1_databases]]
binding = "DB"
database_name = "corporate-tambola"
database_id = "4a6a1d3f-f1c7-44ac-b0ce-4cebd749a8de"

[vars]
DAILY_WRITE_BUDGET = "80000"
PAY_HOP_URL = "https://itservices-rajat-agarwal.pages.dev/payframe/"   # Option 1: the Razorpay window runs on the website registered with Razorpay
# PUBLIC_ORIGIN, MAIL_FROM and OWNER_NOTIFY_EMAIL are Pages variables set in Cloudflare (a name cannot be in both places); the code defaults carry the same values.
COMPANY_JSON = '{"email":"hello@corporatetambola.com","phone":"(+91) 96503 97480","sacDescription":"Software solutions and products"}'
