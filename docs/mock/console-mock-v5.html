function sum(role,n){var v=S.v;if(role=='organizer'||role=='host'){return [(v.occ=='Other'?(v.oname||'Your game'):v.occ)+', '+dayText()+', '+timeText(),'Up to '+v.cap+', '+v.tix+' ticket'+(v.tix=='1'?'':'s')+', '+v.spd,nprizes()+' prizes ('+v.bundle+')',used()+' of '+(5*Number(v.tix))+' moments','Guest link ready',S.paid?'Paid. The game is on':'Payment pending','Opens when the game starts','After the game'][n-1]||''}
if(role=='cohost'){return [dayText()+', '+timeText(),'12 people brought',S.paid?'Paid':'Payment pending'][n-1]||''}
return ''}
function steps(){return R[S.role].steps}
function ndone(){return steps().filter(function(s){return S.done[S.role][s[0]]}).length}
function nextStep(){var a=steps();for(var i=0;i<a.length;i++){if(!S.done[S.role][a[i][0]])return a[i]}return null}
function secHtml(s){var n=s[0],isopen=S.open==n,d=S.done[S.role][n],c=s[2];
return '<div class="sec" id="sec'+n+'" style="'+(isopen?'border:1.5px solid var(--text-tint-'+c+')':'')+'"><div class="sech" data-open="'+n+'" style="background:var(--bg-tint-'+c+')"><span class="num" style="background:var(--text-tint-'+c+');color:var(--surface-2)">'+n+'</span><span style="flex:1;min-width:0"><span style="font-size:14px;font-weight:500;color:var(--text-tint-'+c+')">'+s[1]+'</span><br><span style="font-size:11px;color:var(--text-tint-'+c+')">'+(isopen||!(sum(S.role,n))?s[3]:esc(sum(S.role,n)))+'</span></span>'+(d?'<i class="ti ti-circle-check" style="color:var(--text-tint-'+c+');font-size:20px" aria-label="Done"></i>':'<i class="ti ti-chevron-'+(isopen?'up':'down')+'" style="color:var(--text-tint-'+c+')" aria-hidden="true"></i>')+'</div>'+(isopen?'<div class="secb"><div class="say" style="'+tintx(c)+'"><i class="ti ti-message-circle" aria-hidden="true"></i><span>'+(d?'Saved. You can change it any time.':s[4])+'</span></div>'+form(S.role,n)+'<div style="margin-top:12px">'+btn('Save and continue','cont','arrow-right')+'</div></div>':'')+'</div>'}

function aiHtml(){var org=S.role=='organizer';if(S.role=='host'||S.role=='cohost')return '';
return '<div class="ai"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><i class="ti ti-pin" aria-hidden="true" style="color:var(--text-secondary)"></i><b style="font-size:14px;font-weight:500">'+(org?'Your AI assistant work link':S.role=='refer'?'Your referral link':'Your demo link')+'</b>'+btn('Copy','copyai','copy')+'</div><div class="small" style="margin:6px 0 0">'+(org?'Copy and paste it in any AI chat, like ChatGPT, Gemini, Claude, Grok, DeepSeek, z.ai and others. Copy it as many times as you like.':'Copy it and share it as many times as you like.')+'</div></div>'}

function progHtml(){var t=steps().length,d=ndone(),p=Math.round(d*100/t);return '<div class="prog"><div style="display:flex;justify-content:space-between;font-size:12px"><span>Your progress · saved</span><span><b style="font-weight:500">'+d+' of '+t+' done</b> · '+p+'%</span></div><div class="track"><div class="fill" style="width:'+p+'%"></div></div><div class="jump"><span>Jump to</span>'+steps().map(function(s){return '<button class="dot" data-open="'+s[0]+'" aria-label="Step '+s[0]+': '+s[1]+'" style="'+tintx(s[2])+(S.open==s[0]?';outline:2px solid var(--text-tint-'+s[2]+')':'')+'">'+s[0]+'</button>'}).join('')+'<button class="pill" data-act="help" style="padding:2px 10px;font-size:11px">Help</button></div></div>'}
function payNote(){var g=S.role=='organizer'||S.role=='host'||S.role=='cohost';if(!g||S.paid)return '';return '<div class="paynote" role="note"><b style="font-weight:500">A payment is pending for this game.</b> Just one of you needs to make it: the Organizer, a Host or a Co-host. Guests pay nothing. It is for this one game only, with no commitment and no repeat charges.</div>'}
function barHtml(){var g=S.role=='organizer'||S.role=='host'||S.role=='cohost';return '<div class="bar"><span style="font-weight:500;font-size:14px">Corporate Tambola</span><span class="role" aria-label="Your role">'+R[S.role].label+(S.role=='host'?' 1 of 3':'')+'</span>'+(g?'<span class="'+(S.paid?'paid':'pend')+'" aria-label="Payment status">'+(S.paid?'Paid':'Payment pending')+'</span><span class="small" style="margin:0;flex:1;text-align:right">'+(S.v.occ=='Other'?'Your game':S.v.occ)+' · '+dayText()+', '+timeText()+'</span>':'<span class="small" style="margin:0;flex:1;text-align:right">Partner area</span>')+'</div>'}
function helpHtml(){return '<div class="sec" id="help" style="margin-top:14px;border:1.5px solid var(--border-strong)"><div class="sech" style="background:var(--surface-1);cursor:default"><span class="num" style="background:var(--text-primary);color:var(--surface-2)"><i class="ti ti-help" aria-hidden="true"></i></span><span style="flex:1"><span style="font-size:14px;font-weight:500">Help</span><br><span style="font-size:11px;color:var(--text-secondary)">Tap a question. The answer is short.</span></span></div><div class="secb">'+HELP.map(function(q,i){return '<div class="q"><div class="qh" data-q="'+i+'"><span>'+q[0]+'</span><i class="ti ti-chevron-'+(S.q==i?'up':'down')+'" aria-hidden="true"></i></div>'+(S.q==i?'<div class="qa">'+q[1]+'</div>':'')+'</div>'}).join('')+'<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">'+btn('Back to your steps','steps','arrow-up')+btn('Back to top','top','chevron-up')+'</div></div></div>'}
function mainHtml(){return '<div id="top"></div>'+(S.toast?'<div class="toast">'+esc(S.toast)+'</div>':'')+'<div class="small" style="margin:0 0 8px">'+R[S.role].note+'</div>'+nextHtml()+steps().map(secHtml).join('')+helpHtml()}
function sheetHtml(){return '<div style="padding:8px 10px;border-bottom:0.5px solid var(--border);background:var(--surface-1)"><div style="font-size:12px;color:var(--text-secondary);margin:2px 6px 4px">Your game at a glance</div>'+synHtml()+'</div>'}

var ph=S.dev=='phone',h='';

else{h='<div class="frame">'+barHtml()+payNote()+aiHtml()+progHtml()+'<div class="body"><div class="side"><div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><span class="num" style="background:var(--text-primary);color:var(--surface-2)">'+R[S.role].label.charAt(0)+'</span><span style="font-size:12px"><span style="color:var(--text-secondary)">You are</span><br><b style="font-weight:500">'+R[S.role].label+'</b></span></div><div style="font-size:12px;color:var(--text-secondary);margin:0 6px 4px">Your game at a glance</div>'+synHtml()+((S.role=='organizer'||S.role=='host'||S.role=='cohost')?'<div style="margin:10px 6px 0;font-size:12px;color:var(--text-secondary)">Price: Rs '+PRICE[S.v.cap]+' with GST<br>Payment: <b style="font-weight:500">'+(S.paid?'Paid':'Pending')+'</b></div>':'')+'</div><div class="main">'+mainHtml()+'</div></div></div>'}
document.getElementById('out').innerHTML=h;
document.getElementById('roles').innerHTML=Object.keys(R).map(function(k){return '<button class="pill'+(S.role==k?' on':'')+'" data-role="'+k+'">'+R[k].label+'</button>'}).join(' ');
document.getElementById('devs').innerHTML=['laptop','phone'].map(function(k){return '<button class="pill'+(S.dev==k?' on':'')+'" data-dev="'+k+'">'+(k=='laptop'?'Laptop view':'Phone view (installable app)')+'</button>'}).join(' ');
document.getElementById('pays').innerHTML=[false,true].map(function(k){return '<button class="pill'+(S.paid==k?' on':'')+'" data-paid="'+k+'">'+(k?'Paid':'Payment pending')+'</button>'}).join(' ');
document.getElementById('devnote').textContent=ph?'':'scaled down to fit this window';
}
function msg(t){S.toast=t;draw()}
function bundleSet(b){var set={Classic:['early5','top','mid','bot','full'],Simple:['early5','full'],Rich:['early5','top','mid','bot','corners','star','full']}[b];if(!set)return;HS.forEach(function(h){S.v['h_'+h[0]]=set.indexOf(h[0])>=0})}
function go(id){var e=document.getElementById(id);if(e&&e.scrollIntoView){try{e.scrollIntoView({behavior:'smooth',block:'start'})}catch(x){}}}
document.getElementById('mk').addEventListener('click',function(e){
var t=e.target.closest('[data-role],[data-dev],[data-paid],[data-open],[data-chip],[data-pt],[data-ph],[data-q],[data-act]');if(!t)return;
if(t.dataset.role){S.role=t.dataset.role;S.toast='';S.sheet=false;S.q=-1;S.open=nextStep()?nextStep()[0]:1;return draw()}
if(t.dataset.dev){S.dev=t.dataset.dev;return draw()}
if(t.dataset.paid){S.paid=t.dataset.paid=='true';return draw()}
if(t.dataset.open){S.open=Number(t.dataset.open);S.sheet=false;S.toast='';draw();return go('sec'+S.open)}
if(t.dataset.chip){S.v[t.dataset.chip]=t.dataset.val;if(t.dataset.chip=='bundle')bundleSet(t.dataset.val);return draw()}
if(t.dataset.pt){S.v['pt_'+t.dataset.pt]=t.dataset.val;return draw()}
if(t.dataset.ph){S.ph=t.dataset.ph;return draw()}
if(t.dataset.q){var i=Number(t.dataset.q);S.q=S.q==i?-1:i;return draw()}
var a=t.dataset.act;S.toast='';
if(a=='help'){S.q=S.q<0?0:S.q;draw();return go('help')}
if(a=='top'){draw();return go('top')}
if(a=='steps'){draw();return go('sec'+S.open)}
if(a=='sheet'){S.sheet=!S.sheet;return draw()}
if(a=='noinst'){S.install=false;return draw()}
if(a=='cont'){S.done[S.role][S.open]=1;var n=nextStep();S.open=n?n[0]:S.open;draw();return go('sec'+S.open)}
if(a=='pay'){S.paid=true;S.toast='Mock: payment recorded. The game is on.';return draw()}
var T={copyai:'Copied. Paste it into your AI chat. Copy it again any time.',copy:'Link copied.',test:'Opens a page that shows this exactly as a guest sees it.',pub:'Mock: opens the Publish card. You tap once.',erase:'Mock: asks you to confirm first.',send:'Sent to every phone.',host:'Co-host links created. Send each to one person only.',list:'Mock: opens the guest list box.',big:'Opens the big-screen page.',x:'Mock: not wired in this preview.'};
msg(T[a]||'')});
document.getElementById('mk').addEventListener('change',function(e){var k=e.target.dataset.k;if(!k)return;S.v[k]=e.target.checked;if(k.indexOf('h_')==0&&e.target.checked)S.ph=k.slice(2);draw()});
document.getElementById('mk').addEventListener('input',function(e){var k=e.target.dataset.t;if(k)S.v[k]=e.target.value});
draw();
})();
