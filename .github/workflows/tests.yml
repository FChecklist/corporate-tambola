# On the live commit c6897f2 every one of the 248 files passes here (4,028 tests); the one failure seen on the Windows laptop (ai-enablement) does not happen on Linux.
# Runs on GitHub's free servers because the owner's laptop cannot hold the whole suite (see docs/KNOWLEDGE/03-HOW.md of the V2 branch:
# "run every test file as its own process"). Nothing here deploys, publishes or touches a live database.
name: tests
on:
  push:
    branches: ['boss16/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
      - name: typecheck (production code must be clean; the known type debt in tests and tools is counted and shown, not failed on)
        shell: bash
        run: |
          set +e
          bun run typecheck > tsc.log 2>&1; rc=$?
          tail -3 tsc.log
          all=$(grep -cE "\([0-9]+,[0-9]+\): error TS" tsc.log)
          debt=$(grep -cE "^(\S+/test/|tools/)\S*\([0-9]+,[0-9]+\): error TS" tsc.log)
          echo "type errors: $all in all, $debt in tests and tools (known debt), $((all-debt)) in production code"
          if [ $((all-debt)) -ne 0 ]; then grep -E "error TS" tsc.log | grep -vE "^(\S+/test/|tools/)"; exit 1; fi
          if [ $rc -ne 0 ] && [ "$all" -eq 0 ]; then echo "tsc failed without listing errors"; exit 1; fi
  each-file:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
      - name: every test file as its own process
        shell: bash
        run: |
          set +e
          files=$(find packages apps tools/control-worker -name '*.test.ts' -not -path '*/node_modules/*' | sort)
          total=0; pass=0; fail=0; bad=()
          for f in $files; do
            out=$(bun test --timeout 60000 "$f" 2>&1); rc=$?
            p=$(echo "$out" | grep -E '^ *[0-9]+ pass' | tail -1 | awk '{print $1}'); p=${p:-0}
            x=$(echo "$out" | grep -E '^ *[0-9]+ fail' | tail -1 | awk '{print $1}'); x=${x:-0}
            total=$((total+1)); pass=$((pass+p)); fail=$((fail+x))
            if [ $rc -ne 0 ]; then
              bad+=("$f"); echo "::group::FAILED $f"; echo "$out" | tail -60; echo "::endgroup::"
            fi
          done
          echo "files=$total pass=$pass fail=$fail"
          if [ ${#bad[@]} -gt 0 ]; then echo "failing files:"; printf ' %s\n' "${bad[@]}"; exit 1; fi
