  <div class="wrap">
  ${S(1,'Organizer (HR, admin, event lead)','Buy a game pack',[`Choose how many people can play: from 100 to 10,000 engagements.`,`Pay per game – ₹ with GST in India, US$ everywhere else. No yearly plan.`,`Use your work email. It becomes your login. That is the only verification in the system.`],shot('buy'),"go({mode:'site'});setTimeout(checkout,50)")}
  ${S(2,'Organizer','Set up the game',[`Name, date, start time (every player sees it in their own time zone).`,`Family members per player (0–4), whether family can win, whether players can invite colleagues.`,`Calling: AI voice every 10 seconds, host voice, or both – in Hinglish, Tamlish, Kanglish, Tenglish or English.`,`Prizes, and up to 3 <b>brand breaks</b>: your product video, a short presentation or a speech, after a chosen number.`],shot('setup'),"go({mode:'console',role:'org',gid:'DW26'})")}
  ${S(3,'Organizer','Add mobile numbers',[`Paste a list or upload Excel / CSV – any format, any country.`,`We fix formats (+91, 0091, 09876…) and remove repeats before anything is saved.`,`Nothing is added until you press <b>Add N people</b>.`],shot('add'),"go({mode:'console',role:'org',gid:'DW26'})")}
  ${S(4,'Organizer','People and roles',[`Make <b>Hosts</b> to help on the day and <b>Team Leads</b> to bring in their teams (10–100 each).`,`Each Host and Team Lead gets a personal link that works on one phone.`,`The player limit always wins: when the pack is full, nobody else gets in.`],shot('people'),"go({mode:'console',role:'org',gid:'DW26'})")}
  ${S(5,'Organizer · Team Lead','Share the link and passes',[`One game link for everyone on your list – WhatsApp, email, intranet or a QR code on screen.`,`Team Leads create personal passes for colleagues; every player can send passes to their family.`,`Passes work on one phone only and can be cancelled or re-issued.`],`<div class="hshots">${shot('share')}${shot('tl')}</div>`,"go({mode:'console',role:'tl'})")}
  ${S(6,'Player','Join from the phone',[`Open the link, pick the country, type the mobile number. That's it.`,`On the list? Confirm the name, tick consent, and the ticket is ready.`,`A pass holder does not type anything – the pass already knows the number.`],`<div class="hshots">${shot('join',1)}${shot('pass',1)}</div>`,"newPhoneLink()")}
  ${S(7,'Organizer · Host','Waiting room and second phones',[`People not on the list can ask to join. You admit or decline them.`,`If someone opens a joined number on a second phone, it is blocked and you choose: keep the first phone or move to the new one.`],shot('wait'),"go({mode:'console',role:'host'})")}
  ${S(8,'Organizer','Start the game',[`Two ticks confirm you are ready. Entry closes the moment you press Start.`,`Numbers are drawn at random by the system. Nobody – not even you – can choose one.`],shot('start'),"go({mode:'console',role:'org',gid:'DW26'})")}
  ${S(9,'Player · Host','Play, claim, win',[`Players cut numbers themselves. Each number is shown only once.`,`A claim pauses the game for everyone. The system checks it and shows <b>Prize awarded</b> or <b>Bogey</b>.`,`During brand breaks everyone watches your video or hears your speech.`],`<div class="hshots">${shot('ticket',1)}${shot('awarded',1)}</div>`,"scenario('live');go({mode:'phone'})")}
  ${S(10,'Organizer','Report, then everything is deleted',[`Copy the winners and participants report straight into Excel.`,`24 hours after the game, every name and number is deleted. Only an anonymous count remains.`,`You give the prizes directly. Players never pay.`],shot('report'),"scenario('ended');go({mode:'console',role:'org',gid:'DW26'})")}
  <div class="center" style="padding:40px 0"><h2 style="font:600 28px var(--serif);margin:0 0 14px">Ready to engage your company's extended family?</h2><button class="btn" onclick="go({mode:'site'})">See price and create your Tambola ${ic('arrow')}</button></div>
  </div></div>`}
</script>
<script>
/* =====================================================================
   CONSOLES: Organizer, Host, Team Lead
   ===================================================================== */
function patch(id,html){const e=$(id);if(e&&e._h!==html){e.innerHTML=html;e._h=html}}
const ROLE_NAME={org:'Organizer',host:'Host',team_lead:'Team Lead',player:'Player'};
function statusPill(g){return{open:'<span class="pill ok"><i></i>Open for entry</span>',started:'<span class="pill warn"><i></i>Game in progress · entry closed</span>',ended:'<span class="pill bad"><i></i>Game ended</span>',purged:'<span class="pill"><i></i>Deleted</span>'}[g.status]}
function pStatus(p){return p.status==='joined'?'<span class="pill ok"><i></i>Joined</span>':p.status==='pass_sent'?'<span class="pill info"><i></i>Pass sent</span>':'<span class="pill"><i></i>Not joined</span>'}
function howJoined(g,p){if(p.source==='list')return'Your list';if(p.source==='waiting_room')return p.invitedBy?`Admitted · invited by ${esc((P(g,p.invitedBy)||{}).name||'a player')}`:'Admitted from waiting room';const s=P(g,p.invitedBy);return`Pass from ${esc(s?s.name:'someone')}${p.kind==='family'?' (family)':''}`}
function waMsg(g,p){const first=(p.name||'').split(' ')[0]||'there';if(p.role==='host')return`Hi ${first}, you are a Host for ${g.name}. Open your link to help admit players: ${passLink(p)}\nPlease don't forward this link.`;
  if(p.role==='team_lead')return`Hi ${first}, you are a Team Lead for ${g.name}. Open your link to bring in up to ${p.cap} colleagues: ${passLink(p)}\nPlease don't forward this link. It works on one phone only.`;
  return`Hi ${first}, here is your personal pass for ${g.name}: ${passLink(p)}\nIt works on one phone only, so please don't forward it.`}
const wa=(e164,msg)=>`https://wa.me/${e164?e164.replace('+',''):''}?text=${encodeURIComponent(msg)}`;
function gameMsg(g){return g.msg||`You're invited to ${g.name} on ${fmtDT(g.startsAt)}!\nJoin here from your phone: ${gameLink(g)}\nEntry closes when the game starts.`}
let UI={paste:'',addHow:'paste',check:null,sel:new Set(),q:'',filter:'all',qsel:new Set(),ck1:false,ck2:false,tl:{type:'colleague',name:'',cc:null,num:'',result:null},pauseWhy:'Internet problem'};

function viewConsole(){const role=R.role;
  if(role==='org'){const o=DB.session&&DB.organizers.find(x=>x.id===DB.session.orgId);if(!o)return`<div class="wrap"><div class="panel center"><h2>Organizer login needed</h2><p class="muted">Sign in with your work email.</p><button class="btn" onclick="orgLogin()">Organizer login</button></div></div>`;
    const games=DB.games.filter(g=>g.orgId===o.id);let g=G(R.gid);if(!g||g.orgId!==o.id){g=games[0];R.gid=g&&g.id}if(!g)return`<div class="wrap"><div class="panel">No games yet. <button class="btn sm" onclick="go({mode:'site'})">Buy a game</button></div></div>`;
    return consoleFor(g,{role:'org',o,games})}
  const g=G(R.gid)||DB.games[0];if(!g)return'';R.gid=g.id;
  if(role==='host'){const hosts=g.participants.filter(p=>p.role==='host');const p=hosts.find(x=>x.id===R.pid)||hosts[0];if(!p)return`<div class="wrap"><div class="panel center"><h2>No Host in this game</h2><p class="muted">The Organizer makes Hosts in step 3 (People and roles).</p><button class="btn" onclick="go({role:'org'})">Open the Organizer console</button></div></div>`;R.pid=p.id;return consoleFor(g,{role:'host',pid:p.id,me:p})}
  if(role==='tl'){const tls=g.participants.filter(p=>p.role==='team_lead');const p=tls.find(x=>x.id===R.pid)||tls[0];if(!p)return`<div class="wrap"><div class="panel center"><h2>No Team Lead in this game</h2><p class="muted">The Organizer or a Host makes Team Leads in People and roles.</p><button class="btn" onclick="go({role:'org'})">Open the Organizer console</button></div></div>`;R.pid=p.id;return viewTL(g,p)}}
function head(g,A){const w=g.waiting.length,opens=g.conflicts.filter(c=>!c.done).length;
  return`<div class="chead"><div><div class="eyebrow">${A.role==='org'?'Organizer console':'Host console · '+esc(A.me.name)} · ${esc(g.org)}</div>
   <h1>${A.role==='org'&&A.games.length>1?`<select class="inp" style="font:600 20px var(--serif);padding:4px 8px;width:auto;max-width:100%" onchange="go({gid:this.value})">${A.games.map(x=>`<option value="${x.id}" ${x.id===g.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:esc(g.name)}</h1>
   <div class="stats" style="margin-top:4px"><span>${ic('clock')} ${g.status==='open'?'Starts':'Started'} ${fmtDT(g.status==='open'?g.startsAt:g.startedAt)} (your time)</span></div></div>
   <div style="text-align:right"><div>${statusPill(g)}</div><div class="stats" style="justify-content:flex-end;margin-top:6px" id="hStats"><span>Joined <b>${joinedN(g)}</b></span><span>Places used <b>${placesUsed(g)}</b> / <b>${g.limit}</b></span><span>Waiting <b>${w}</b></span>${opens?`<span class="pill warn">${opens} phone alert</span>`:''}</div></div></div>`}
function consoleFor(g,A){const isOrg=A.role==='org';let h=`<div class="wrap">${head(g,A)}`;
  if(g.status==='purged'){const s=DB.summaries.find(x=>x.gameId===g.id);return h+`<div class="panel"><div class="phead"><div class="step">${ic('trash')}</div><div><h2>Personal data deleted</h2><p>24 hours after the game, every name, mobile number and phone link was deleted. Only this anonymous summary remains.</p></div></div>
    <div class="grid" style="margin-top:10px"><div class="meter"><span>Players</span><b>${s?s.players:0}</b></div><div class="meter"><span>Family members</span><b>${s?s.family:0}</b></div><div class="meter"><span>Team Leads</span><b>${s?s.teamLeads:0}</b></div></div></div></div>`}
  if(g.status==='started')h+=livePanel(g,A);
  if(g.status==='ended')h+=isOrg?reportPanel(g):`<div class="panel"><div class="phead"><div class="step">${ic('flag')}</div><div><h2>The game has ended</h2><p>Only the Organizer can see the report.</p></div></div></div>`;
  let n=1;const sec=[];
  sec.push(setupPanel(g,A,n++));
  if(isOrg)sec.push(addPanel(g,n++));
  sec.push(peoplePanel(g,A,n++));sec.push(sharePanel(g,A,n++));sec.push(waitPanel(g,A,n++));
  if(g.status==='open')sec.push(startPanel(g,A,n++));
  if(g.status==='open'&&isOrg)sec.push(`<div class="panel"><div class="phead"><div class="step">${n++}</div><div><h2>After the game</h2><p>The report (players, winners, tickets, the order numbers were called) appears here when the game ends. Copy it before it is deleted: every mobile number is deleted 24 hours after the game ends.</p></div></div></div>`);
  if(g.status!=='open')sec.reverse();
  return h+sec.join('')+'</div>'}

/* ---------- 1. setup ---------- */
function chips(name,opts,val,dis,fn){return`<div class="chips" role="radiogroup" aria-label="${name}">${opts.map(([v,l])=>`<button class="chip ${String(v)===String(val)?'on':''}" ${dis?'disabled':''} role="radio" aria-checked="${String(v)===String(val)}" onclick="${fn}(${JSON.stringify(v).replace(/"/g,'&quot;')})">${l}</button>`).join('')}</div>`}
function setG(k,v){const g=G(R.gid);if(!entryOpen(g))return toast('Settings are locked after the start.');if(R.role==='host'&&k!=='family')return;g[k]=v;logG(g,`${R.role==='org'?'Organizer':'Host'} changed ${k}`);render()}
function timeOpts(g){const d=new Date(g.startsAt);const cur=d.getHours()*60+d.getMinutes();let o=(cur%30||cur<360)?`<option value="${cur}" selected>${fmtT(d)}</option>`:'';for(let m=360;m<=1410;m+=30){const t=new Date(g.startsAt);t.setHours(Math.floor(m/60),m%60,0,0);o+=`<option value="${m}" ${m===cur?'selected':''}>${fmtT(t)}</option>`}return o}
function setTime(m){const g=G(R.gid);const d=new Date(g.startsAt);d.setHours(Math.floor(m/60),m%60,0,0);setG('startsAt',d.getTime())}
function setDate(v){const g=G(R.gid);const d=new Date(g.startsAt),[y,mo,da]=v.split('-').map(Number);d.setFullYear(y,mo-1,da);setG('startsAt',d.getTime())}
function setupPanel(g,A,n){const ro=g.status!=='open'||A.role!=='org',fro=g.status!=='open';const d=new Date(g.startsAt);const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return`<div class="panel" id="p-setup"><div class="phead"><div class="step">${n}</div><div><h2>Set up the game</h2><p>Pick an option in each box. You can change these until the game starts.</p>${A.role==='host'?'<p class="lockmsg">As a Host you can only change the family limit. The Organizer controls the rest.</p>':''}${g.status!=='open'?'<p class="lockmsg">All settings locked when the game started.</p>':''}</div></div>
  <div class="grid">
   <div><label class="lb" for="gName">Game name</label><input class="inp" id="gName" maxlength="60" value="${esc(g.name)}" ${ro?'disabled':''} onchange="setG('name',this.value.trim()||'My Tambola')"></div>
   <div><label class="lb" for="gDate">Game date</label><input class="inp" type="date" id="gDate" value="${iso}" ${ro?'disabled':''} onchange="setDate(this.value)"></div>
   <div><label class="lb" for="gTime">Start time</label><select class="inp" id="gTime" ${ro?'disabled':''} onchange="setTime(+this.value)">${timeOpts(g)}</select><p class="hint">Your local time (${esc(g.tz)}). Players see it in their own time.</p></div>
   <div><label class="lb" for="gCty">Most players' country</label><select class="inp" id="gCty" ${ro?'disabled':''} onchange="setG('country',this.value)">${countryOpts(g.country)}</select><p class="hint">Numbers without a country code are read as this country.</p></div>
   <div><label class="lb">Player limit (everyone, including family)</label><div class="row"><b class="mono" style="font-size:20px">${g.limit.toLocaleString()}</b>${A.role==='org'&&g.status==='open'?`<button class="btn sm line" onclick="upgrade(G('${g.id}'))">${ic('users')} Raise limit</button>`:''}</div><p class="hint">Equals the pack you bought. Entry stops at this number, whatever the invite limits allow.</p></div>
  </div>
  <div class="grid">
   <div><label class="lb">Family members each player can bring</label>${chips('Family limit',[[0,'None'],[1,'1'],[2,'2'],[3,'3'],[4,'4']],g.family,fro,"setFam")}<p class="hint">Family members get their own pass. They cannot invite anyone.</p></div>
   <div><label class="lb">Can family members win prizes?</label>${chips('Family can win',[[true,'Yes'],[false,'No, they play for fun']],g.familyCanWin,ro,"setFW")}</div>
   <div><label class="lb">Can regular players invite colleagues?</label>${chips('Player invites',[[0,'No'],[1,'1 each'],[2,'2 each'],[3,'3 each']],g.pinv,ro,"setPI")}<p class="hint">Their invites go to the waiting room for you to approve.</p></div>
  </div>
  <div class="grid">
   <div><label class="lb">How numbers are called</label>${chips('Calling mode',[['ai','AI voice'],['manual','Host voice'],['both','AI voice + host speaks']],g.callMode,ro,"setCM")}<p class="hint">${{ai:'The system calls a random number every 10 seconds.',manual:'A Host presses "Draw" (the system picks at random) and announces it. At least 5 seconds apart.',both:'AI calls every 10 seconds. Hosts can speak to everyone at any time.'}[g.callMode]}</p></div>
   <div><label class="lb">Commentary language</label>${chips('Language',Object.entries(LANGS).map(([k,v])=>[k,v.label]),g.lang,ro,"setLang")}<p class="hint">Example: “${esc(line(27,g.lang))}”</p></div>
  </div>
  <label class="lb">Prizes (you give them directly)</label>
  ${g.prizes.map((z,i)=>`<div class="prz"><select class="inp" ${ro?'disabled':''} aria-label="Pattern" onchange="przSet(${i},'k',this.value)">${Object.entries(PAT).map(([k,v])=>`<option value="${k}" ${k===z.k?'selected':''} ${k!==z.k&&g.prizes.some(x=>x.k===k)?'disabled':''}>${v.name}</option>`).join('')}</select>
    <input class="inp" ${ro?'disabled':''} value="${esc(z.prize)}" aria-label="Prize" onchange="przSet(${i},'prize',this.value)"><button class="btn sm danger x" ${ro||g.prizes.length<2?'disabled':''} onclick="przDel(${i})" aria-label="Remove prize">${ic('trash')}</button></div>`).join('')}
  <div class="row"><button class="btn sm line" ${ro||g.prizes.length>=8?'disabled':''} onclick="przAdd()">+ Add a prize</button><span class="tiny muted">Two or more valid claims on the same number share the prize equally.</span></div>
  <label class="lb">Brand breaks (up to 3) – your moment with everyone</label>
  ${g.breaks.map((b,i)=>`<div class="bbrow"><div><label class="lb">After call</label><select class="inp" ${ro?'disabled':''} onchange="bbSet(${i},'after',+this.value)">${[...Array(17)].map((_,j)=>(j+1)*5).map(v=>`<option ${v===b.after?'selected':''}>${v}</option>`).join('')}</select></div>
    <div><label class="lb">Type</label><select class="inp" ${ro?'disabled':''} onchange="bbSet(${i},'type',this.value)">${[['video','Product video'],['slides','Presentation'],['speech','Speech (host mic)']].map(([v,l])=>`<option value="${v}" ${v===b.type?'selected':''}>${l}</option>`).join('')}</select></div>
    <div><label class="lb">Title players see</label><input class="inp" ${ro?'disabled':''} value="${esc(b.title)}" onchange="bbSet(${i},'title',this.value)"></div>
    <div><label class="lb">Length</label><select class="inp" ${ro?'disabled':''} onchange="bbSet(${i},'dur',+this.value)">${[[15,'15 sec'],[30,'30 sec'],[45,'45 sec'],[60,'1 min'],[120,'2 min'],[180,'3 min']].map(([v,l])=>`<option value="${v}" ${v===b.dur?'selected':''}>${l}</option>`).join('')}</select></div>
    ${b.type==='video'?`<div><label class="lb">Video file</label><input type="file" accept="video/*" ${ro?'disabled':''} onchange="bbFile(${i},this.files[0])" style="font-size:12px;max-width:100%"><div class="tiny muted">${b.fileName?esc(b.fileName):'Optional in the prototype'}</div></div>`:b.type==='slides'?`<div><label class="lb">Slides (one line each)</label><input class="inp" ${ro?'disabled':''} value="${esc(b.slides||'')}" placeholder="Thank you | FY26 results | New office" onchange="bbSet(${i},'slides',this.value)"></div>`:'<div class="tiny muted">The Host speaks live during the break.</div>'}
    <button class="btn sm danger" ${ro?'disabled':''} onclick="bbDel(${i})" aria-label="Remove break">${ic('trash')}</button>${b.done?'<span class="pill ok">Done</span>':''}</div>`).join('')}
  <button class="btn sm line" ${ro||g.breaks.length>=3?'disabled':''} onclick="bbAdd()">+ Add a brand break</button> <span class="tiny muted">The game pauses for everyone during a break. Breaks never start while a claim is being checked.</span>
  </div>`}
const setFam=v=>setG('family',v),setFW=v=>setG('familyCanWin',v),setPI=v=>setG('pinv',v),setCM=v=>setG('callMode',v),setLang=v=>setG('lang',v);
function przSet(i,k,v){const g=G(R.gid);g.prizes[i][k]=v;render()}function przDel(i){const g=G(R.gid);g.prizes.splice(i,1);render()}
function przAdd(){const g=G(R.gid);const k=Object.keys(PAT).find(k=>!g.prizes.some(z=>z.k===k));if(k)g.prizes.push({k,prize:'Voucher',share:'equal'});render()}
function bbAdd(){const g=G(R.gid);const used=g.breaks.map(b=>b.after);const a=[20,45,70,30,60].find(x=>!used.includes(x));g.breaks.push({id:uid('b'),after:a,type:'video',title:'Our new product',dur:60,done:false});render()}
function bbSet(i,k,v){const g=G(R.gid);if(k==='after'&&g.breaks.some((b,j)=>j!==i&&b.after===v))return toast('Another break is already after that call.');g.breaks[i][k]=v;g.breaks.sort((a,b)=>a.after-b.after);render()}
function bbDel(i){const g=G(R.gid);const[b]=g.breaks.splice(i,1);render();toast('Brand break removed',()=>{g.breaks.push(b);g.breaks.sort((x,y)=>x.after-y.after)})}
function bbFile(i,f){if(!f)return;const g=G(R.gid);g.breaks[i].file=URL.createObjectURL(f);g.breaks[i].fileName=f.name;render()}

/* ---------- 2. add numbers ---------- */
const EXAMPLE=`Name,Mobile
Arjun Kapoor,98200 44556
Fatima Khan,+91 99876 11223
Suresh Kumar,09123456780
Lakshmi Menon,0091 9988776655
Arjun Kapoor,98200-44556
Joseph D'Souza,919812312312
Emily Chen,+65 9123 4567
Ahmed Ali,+971 50 765 4321
Ravi,12345
Nisha Patel,98765abc10
Harpreet Kaur,98145 67890
Sophie Martin,+44 7700 900987
Anil Verma,9811 223 344`;
function addPanel(g,n){const lock=g.status!=='open';const c=UI.check&&UI.check.gid===g.id?UI.check.res:null;const items=c?[...c.ready,...c.fixed]:[];
  return`<div class="panel" id="p-add"><div class="phead"><div class="step">${n}</div><div><h2>Add mobile numbers</h2><p>Paste or upload in any format: 98765 43210, +91 98765 43210, 09876543210, 0091 98765 43210, +44 7700 900123. We fix the format and remove repeats.</p>${lock?'<p class="lockmsg">Entry is closed. Nobody can be added after the start.</p>':''}</div></div>
  <label class="lb">How do you want to add them?</label>${chips('Add how',[['paste','Paste a list'],['file','Upload Excel or CSV']],UI.addHow,lock,"setAddHow")}
  ${UI.addHow==='paste'?`<label class="lb" for="paste">One person per line. Name is optional: “Rahul Mehta, 98765 43210” or just the number.</label><textarea class="inp" id="paste" ${lock?'disabled':''} oninput="UI.paste=this.value">${esc(UI.paste)}</textarea><button class="btn sm ghost" ${lock?'disabled':''} onclick="UI.paste=EXAMPLE;UI.check=null;render()">Fill with an example list</button>`
   :`<label class="lb" for="file">Choose a file (.xlsx, .xls, .csv or .txt). Any column layout works; we find the numbers.</label><input type="file" id="file" accept=".csv,.txt,.xlsx,.xls" ${lock?'disabled':''} onchange="readFile(this.files[0])"><p class="hint">${window.XLSX?'Excel files are read as raw values, so long numbers are safe.':'Excel reader not loaded in this preview – CSV and TXT work.'}</p>`}
  <div class="row" style="margin-top:10px"><button class="btn" ${lock?'disabled':''} onclick="doCheck()">Check numbers</button><span class="tiny muted">Nothing is added until you confirm.</span></div>
  ${c?`<div class="chkres"><span class="pill ok">${c.ready.length} ready</span><span class="pill info">${c.fixed.length} format fixed</span><span class="pill warn">${c.repeats.length} repeats removed</span><span class="pill bad">${c.bad.length} need your attention</span></div>
   ${c.bad.length?`<details class="chk" open><summary>Numbers we could not read (${c.bad.length}). Fix them in the list and check again.</summary><ul>${c.bad.map(x=>`<li><span class="mono">${esc(x.ln)}</span>: ${x.reason}</li>`).join('')}</ul></details>`:''}
   ${c.fixed.length?`<details class="chk"><summary>Formats we fixed (${c.fixed.length})</summary><ul>${c.fixed.map(x=>`<li><span class="mono">${esc(x.ln)}</span> → <b class="mono">${fmtNum(x.e164)}</b></li>`).join('')}</ul></details>`:''}
   ${c.repeats.length?`<details class="chk"><summary>Repeats removed (${c.repeats.length})</summary><ul>${c.repeats.map(x=>`<li><span class="mono">${esc(x.ln)}</span>: ${x.reason}</li>`).join('')}</ul></details>`:''}
   <div id="addErr"></div><button class="btn gold" style="margin-top:10px" ${items.length&&!lock?'':'disabled'} onclick="doCommit()">Add ${plural(items.length,'person','people')} to the game</button>`:''}
  </div>`}
function setAddHow(v){UI.addHow=v;render()}

function readFile(f){if(!f)return;const r=new FileReader();if(/\.xlsx?$/i.test(f.name)){if(!window.XLSX)return toast('The Excel reader is not available here. Save as CSV and try again.');r.onload=e=>{const wb=XLSX.read(e.target.result,{type:'array'});const sh=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(sh,{header:1,raw:true,defval:''});UI.fileText=rows.map(r=>r.map(v=>typeof v==='number'?v.toFixed(0):String(v)).join(',')).join('\n');toast(`Read ${rows.length} rows from ${f.name}. Press Check numbers.`)};r.readAsArrayBuffer(f)}
  else{r.onload=e=>{UI.fileText=e.target.result;toast(`Read ${f.name}. Press Check numbers.`)};r.readAsText(f)}}

    const link=(p.role!=='player'||p.pass)?`<button class="btn sm line" onclick="copy(passLink(P(G('${g.id}'),'${p.id}')),'Link copied')">${ic('copy')}</button> <a class="btn sm line" target="_blank" rel="noopener" href="${wa(p.e164,waMsg(g,p))}">WhatsApp</a>`:'<span class="sub">Uses game link</span>';
    return`<tr><td><input type="checkbox" aria-label="Select ${esc(p.name)}" ${UI.sel.has(p.id)?'checked':''} ${lock?'disabled':''} onchange="selP('${p.id}',this.checked)"></td><td><div>${esc(p.name||'(no name)')}</div><div class="sub">${howJoined(g,p)}</div></td><td class="mono">${fmtNum(p.e164)}</td><td>${roleSel}</td><td>${bring}</td><td>${pStatus(p)}${p.blocked?' <span class="pill bad">Blocked</span>':''}</td><td style="white-space:nowrap">${link} <button class="btn sm ghost" title="Prototype: open this person's phone" onclick="openAsPerson('${g.id}','${p.id}')">${ic('phone')}</button></td></tr>`}).join('');
  return`<div class="panel" id="p-people"><div class="phead"><div class="step">${n}</div><div><h2>People and roles</h2><p>Tick people, then choose what to do with them. Team Leads get their own link to bring in their team. Hosts help you run the game.</p></div></div>
  <div class="row"><input class="inp" style="max-width:260px" placeholder="Search name or number" value="${esc(UI.q)}" oninput="UI.q=this.value;clearTimeout(window._qt);window._qt=setTimeout(render,250)" aria-label="Search">
   <select class="inp" style="max-width:220px" aria-label="Show" onchange="UI.filter=this.value;render()">${[['all','Show everyone'],['player','Players'],['team_lead','Team Leads'],['host','Hosts'],['joined','Joined'],['not_joined','Not joined'],['pass_sent','Pass sent'],['family','Family']].map(([v,l])=>`<option value="${v}" ${v===UI.filter?'selected':''}>${l}</option>`).join('')}</select>
   <span class="tiny muted">${list.length} of ${g.participants.length} shown</span></div>

  <div class="tscroll"><table class="t"><thead><tr><th></th><th>Name</th><th>Mobile</th><th>Role</th><th>Can bring in</th><th>Status</th><th>Their link</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="muted">Nobody here yet. Add mobile numbers in step 2.</td></tr>'}</tbody></table></div></div>`}
function selP(id,on){on?UI.sel.add(id):UI.sel.delete(id);render()}
function actor(){return{role:R.role,pid:R.pid}}
function roleChange(id,v){const g=G(R.gid);const e=setRole(g,actor(),P(g,id),v,25);if(e)toast(e);render()}
function capChange(id,v){const g=G(R.gid);const p=P(g,id);if(colleagueUsed(g,p)>v)return toast(`${p.name} has already used ${colleagueUsed(g,p)}. Cancel some passes first.`);p.cap=v;logG(g,`${p.name}'s limit set to ${v}`);render()}
function bulkApply(){const g=G(R.gid);const a=$('bulkAct').value;const ids=[...UI.sel];if(!a)return toast('Choose what to do first.');if(!ids.length)return toast('Tick at least one person.');

function drawQR(t){const el=$('qr');if(!el||el._t===t)return;el._t=t;el.innerHTML='';if(window.QRCode){try{new QRCode(el,{text:t,width:136,height:136,colorDark:'#1C1014',colorLight:'#ffffff'});return}catch(e){}}
  let s='';let h=0;for(const ch of t)h=(h*131+ch.charCodeAt(0))>>>0;for(let y=0;y<21;y++)for(let x=0;x<21;x++){const f=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);h=(h*1103515245+12345)>>>0;const on=f?((x%6===0||y%6===0||(x>1&&x<5&&y>1&&y<5)||(x>15&&x<19&&y>1&&y<5)||(x>1&&x<5&&y>15&&y<19))&&!(x===6&&y>6)):(h>>16)%2;if(on)s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
  el.innerHTML=`<svg viewBox="-1 -1 23 23" width="136" height="136" fill="#1C1014" aria-label="QR code (preview)">${s}</svg>`}

/* ---------- 5. waiting room + phone alerts ---------- */
function waitPanel(g,A,n){const lock=g.status!=='open';const alerts=g.conflicts.filter(c=>!c.done);UI.qsel=new Set([...UI.qsel].filter(id=>g.waiting.some(w=>w.id===id)));

  ${alerts.map(c=>{const p=P(g,c.pid);if(!p)return'';return`<div class="alert">${ic('phone')}<span style="flex:1;min-width:220px"><b>Second phone tried to join as ${esc(p.name)}</b> <span class="mono">(${fmtNum(p.e164)})</span>. The first phone is still playing. If ${esc(p.name.split(' ')[0])} changed phones, let the new one in.</span><button class="btn sm line" onclick="resolveC('${c.id}','kept')">Keep first phone</button><button class="btn sm" onclick="resolveC('${c.id}','moved')">Let new phone in</button></div>`}).join('')}
  ${g.waiting.length?`<div class="row" style="margin:6px 0"><label class="cb" style="margin:0"><input type="checkbox" ${lock?'disabled':''} ${UI.qsel.size&&UI.qsel.size===g.waiting.length?'checked':''} onchange="UI.qsel=this.checked?new Set(G(R.gid).waiting.map(w=>w.id)):new Set();render()"> Select all</label><span class="sp"></span>
   <button class="btn sm" ${lock||!UI.qsel.size?'disabled':''} onclick="doAdmit([...UI.qsel])">Admit selected</button><button class="btn sm line" ${lock?'disabled':''} onclick="doAdmit(G(R.gid).waiting.map(w=>w.id))">Admit everyone</button><button class="btn sm danger" ${lock||!UI.qsel.size?'disabled':''} onclick="doDecline([...UI.qsel])">Decline selected</button></div>
   <div style="border:1px solid var(--line);border-radius:12px;padding:0 10px">${g.waiting.map(w=>`<div class="qitem"><input type="checkbox" ${lock?'disabled':''} ${UI.qsel.has(w.id)?'checked':''} aria-label="Select ${esc(w.name)}" onchange="this.checked?UI.qsel.add('${w.id}'):UI.qsel.delete('${w.id}');render()"><div style="flex:1"><b>${esc(w.name)}</b> <span class="mono small muted">${fmtNum(w.e164)}</span>${w.info?` <span class="tiny muted">· ${esc(w.info)}</span>`:''}<div class="tiny muted">${w.invitedBy?`Invited by ${esc((P(g,w.invitedBy)||{}).name||'a player')}`:'Used the game link. Not on your list.'}</div></div><span class="tiny muted">${ago(w.at)}</span></div>`).join('')}</div>`
   :`<p class="muted small">Nobody is waiting.</p>`}</div>`}
function resolveC(cid,res){const g=G(R.gid);const c=g.conflicts.find(x=>x.id===cid);resolveConflict(g,c,res);render();toast(res==='moved'?'Moved to the new phone. The old phone was logged out.':'Kept the first phone. The second phone stays blocked.')}
function doAdmit(ids){const g=G(R.gid);const e=admit(g,ids);if(e)return toast(e);UI.qsel=new Set();render();toast(`Admitted ${plural(ids.length,'person','people')}`)}
function doDecline(ids){const g=G(R.gid);const list=decline(g,ids);UI.qsel=new Set();render();toast(`Declined ${plural(list.length,'request')}`,()=>{g.waiting.push(...list);list.forEach(w=>{const d=w.dev&&D(w.dev);if(d)d.declined=null})})}

/* ---------- live control (Organizer + Host) ---------- */
function callerHTML(g){const pz=g.paused;let cls='',ball,eb,ln,sub='';
  if(pz&&pz.type==='claim'){cls='pz';ball=ic('pause');eb='Game paused · checking claim';ln=pz.items.map(c=>`${esc((P(g,c.pid)||{}).name)} – ${PAT[c.k].name}`).join(', ');sub='The system is checking. Everyone waits.'}
  else if(pz&&pz.type==='result'){const ok=pz.results.some(r=>r.ok);cls=ok?'okc':'badc';ball=ic(ok?'check':'x');eb=ok?'Prize awarded':'Bogey';ln=pz.results.map(r=>r.ok?`${esc(r.p.name)} – ${PAT[r.k].name}${r.fun?' (for fun)':''}`:`${esc(r.p.name)} – ${PAT[r.k].name}: bogey`).join(' · ');sub='Shown to everyone. The game continues in a few seconds.'}
  else if(pz&&pz.type==='break'){cls='brk';ball=ic(pz.br.type==='speech'?'mic':pz.br.type==='slides'?'slides':'play');eb=`Brand break · ${Math.max(0,Math.ceil((pz.until-now())/1000))} sec left`;ln=esc(pz.br.title);sub=pz.br.type==='speech'?'Speak now – every player with audio on hears you.':'Playing on every phone.'}
  else if(pz&&pz.type==='emergency'){cls='pz';ball=ic('pause');eb='Emergency pause';ln=esc(pz.reason);sub='Shown to every player.'}
  else{ball=g.current?String(g.current):'<small>Ready</small>';eb=`Now calling · call ${g.called.length} of 90`;ln=g.current?esc(line(g.current,g.lang)):(g.callMode==='manual'?'Press "Draw next number" to call the first number.':'The first number is on its way…');
    sub=g.callMode==='manual'?'Host voice: a Host draws each number.':`Next number in ${Math.max(0,Math.ceil((g.nextAt-now())/1000))} seconds`}
  return`<div class="caller ${cls}"><div class="bigball">${ball}</div><div><div class="eyebrow">${eb}</div><div class="ln">${ln}</div><div class="sub">${sub}</div></div></div>`}
function livePanel(g,A){const up=g.breaks.filter(b=>!b.done);
  return`<div class="panel" style="border-color:var(--gold)"><div class="phead"><div class="step">${ic('play')}</div><div><h2>Live game</h2><p>${A.role==='org'?'You are running the game. Hosts see the same screen.':'You are helping run the game.'} Numbers are always drawn at random by the system. Nobody sees a list of past numbers.</p></div></div>
  <div class="livebox"><div><div id="lvCaller">${callerHTML(g)}</div>
    <div class="row" style="margin-top:10px">
     ${g.callMode==='manual'?`<button class="btn" id="drawBtn" onclick="doDraw()">${ic('draw')} Draw next number</button>`:'<span class="tiny muted" style="flex:1 1 200px">AI voice calls a number every 10 seconds. It cannot be paused except in an emergency.</span>'}
     ${g.callMode!=='ai'?`<button class="talk" style="flex:1 1 100%" id="talkBtn" onclick="toggleTalk()">${ic('mic')}<span><b id="talkT">${TALK.on?'Speaking – tap to stop':'Speak to everyone'}</b><br><span class="tiny muted">Everyone who joined audio hears you</span></span><span class="lvl"><i id="mLvl"></i></span></button>`:''}
    </div>
    <div class="row" style="margin-top:10px"><select class="inp" style="max-width:230px" aria-label="Pause reason" onchange="UI.pauseWhy=this.value">${['Internet problem','Technical problem','Safety','Waiting for the host'].map(r=>`<option ${r===UI.pauseWhy?'selected':''}>${r}</option>`).join('')}</select><span id="lvPause">${pauseBtns(g)}</span>
     ${A.role==='org'?`<span class="sp"></span><button class="btn danger" onclick="askEnd()">${ic('flag')} End game</button>`:''}</div>
    <label class="lb">Brand breaks</label><div class="small">${g.breaks.length?g.breaks.map(b=>`<div>${b.done?'✓':'•'} After call ${b.after}: ${esc(b.title)} (${b.dur} sec) ${b.done?'<span class="pill ok">Done</span>':''}</div>`).join(''):'<span class="muted">None set up for this game.</span>'}</div>
    <label class="lb">Activity</label><ul class="log" id="lvLog">${logHTML(g)}</ul></div>
   <div><label class="lb" style="margin-top:0">Prizes</label><div class="prtab" id="lvPrizes">${prizesHTML(g)}</div>

function pauseBtns(g){return g.paused&&g.paused.type==='emergency'?`<button class="btn sm" onclick="resume(G(R.gid));render()">${ic('play')} Resume</button>`:g.paused&&g.paused.type==='break'?`<button class="btn sm line" onclick="endBreak(G(R.gid))">End brand break now</button>`:`<button class="btn sm line" ${g.paused?'disabled':''} onclick="emergency(G(R.gid),UI.pauseWhy);render()">${ic('pause')} Emergency pause</button>`}

const x0=w=>w[0];
function logHTML(g){return g.log.slice(0,40).map(l=>`<li><time>${fmtTs(l.t)}</time><span>${esc(l.msg)}</span></li>`).join('')}
function bogHTML(g){return g.bogeys.length?g.bogeys.slice(-6).reverse().map(b=>`<div>${esc(b.name)} – ${PAT[b.k].name} <span class="tiny muted">${esc(b.why)}</span></div>`).join(''):'<span class="muted">None so far.</span>'}
function doDraw(){const g=G(R.gid);const who=R.role==='org'?'Organizer':(P(g,R.pid)||{}).name;const e=hostDraw(g,who);if(e)toast(e);liveUpdate()}
function askEnd(){sheet(`<h2>End the game now?</h2><p class="muted">Open prizes will not be awarded. The report becomes available and personal data is deleted 24 hours from now.</p><label class="cb"><input type="checkbox" id="endOk"> I want to end the game for everyone.</label><button class="btn danger block" onclick="if(!$('endOk').checked)return toast('Tick the box to confirm.');endGame(G(R.gid),'ended by the Organizer');closeSheet();render()">End game</button><button class="btn line block" style="margin-top:8px" onclick="closeSheet()">Keep playing</button>`)}
/* speak to everyone: real microphone level meter; players see "Host speaking" */
let TALK={on:false,stream:null,raf:null};
async function toggleTalk(){const g=G(R.gid);if(TALK.on){TALK.on=false;g.talking=false;if(TALK.stream)TALK.stream.getTracks().forEach(t=>t.stop());cancelAnimationFrame(TALK.raf);render();return}
  TALK.on=true;g.talking=true;render();try{TALK.stream=await navigator.mediaDevices.getUserMedia({audio:true});const ac=new(window.AudioContext||window.webkitAudioContext)(),an=ac.createAnalyser();ac.createMediaStreamSource(TALK.stream).connect(an);const buf=new Uint8Array(an.fftSize);
    const loop=()=>{an.getByteTimeDomainData(buf);let m=0;buf.forEach(v=>m=Math.max(m,Math.abs(v-128)));const e=$('mLvl');if(e)e.style.width=Math.min(100,m*1.6)+'%';TALK.raf=requestAnimationFrame(loop)};loop()}catch(e){toast('Microphone not available in this preview. Players still see "Host speaking".')}}

/* ---------- report (Organizer, after the end) ---------- */
function reportRows(g){return g.participants.map(p=>({t:tid(g,p),name:p.name,num:fmtNum(p.e164),role:p.kind==='family'?'Family':ROLE_NAME[p.role],via:p.source==='list'?'Game link (your list)':p.source==='pass'?'Personal pass':'Waiting room',by:(P(g,p.invitedBy)||{}).name||'',st:p.status==='joined'?'Joined':p.status==='pass_sent'?'Pass not used':'Did not join'}))}
function reportTSV(g){const L=[];L.push(['Game',g.name,'Organizer',g.org,'Started',fmtDT(g.startedAt),'Ended',fmtDT(g.endedAt)].join('\t'),'','WINNERS',['Prize','Pattern','Winner','Ticket ID','Mobile','Number of winners','Won on number','Call no.','Time'].join('\t'));
  g.prizes.forEach(z=>(g.won[z.k]||[]).forEach(w=>{const p=P(g,w.pid)||{};L.push([z.prize,PAT[z.k].name,w.name,p.ticket?tid(g,p):'',fmtNum(p.e164),w.share,w.num,w.callNo,fmtTs(w.at)].join('\t'))}));
  L.push('','BOGEYS',['Player','Prize claimed','Reason','Time'].join('\t'));g.bogeys.forEach(b=>L.push([b.name,PAT[b.k].name,b.why,fmtTs(b.at)].join('\t')));
  L.push('','PLAYERS',['Ticket ID','Name','Mobile','Role','Joined through','Invited by','Status'].join('\t'));reportRows(g).forEach(r=>L.push([r.t,r.name,r.num,r.role,r.via,r.by,r.st].join('\t')));
  L.push('','NUMBERS IN THE ORDER CALLED',g.called.join(', '));return L.join('\n')}
function reportPanel(g){const del=g.endedAt+864e5;const wins=g.prizes.flatMap(z=>(g.won[z.k]||[]).map(w=>({z,w})));
  return`<div class="panel" id="p-report" style="border-color:var(--gold)"><div class="phead"><div class="step">${ic('flag')}</div><div><h2>After the game</h2><p>Copy the game report before it is deleted. We delete every mobile number 24 hours after the game ends.</p></div></div>
  <div class="alert">${ic('clock')}<span style="flex:1"><b>All mobile numbers will be deleted on ${fmtDT(del)}.</b> Copy the report now and keep it with your records.</span><button class="btn sm" onclick="copy(reportTSV(G('${g.id}')),'Report copied – paste it into Excel')">${ic('copy')} Copy report (for Excel)</button></div>
  <label class="lb">Winners</label><div class="tscroll"><table class="t"><thead><tr><th>Prize</th><th>Winner</th><th>Ticket ID</th><th>Winners</th><th>Won on</th><th>Time</th></tr></thead><tbody>${wins.length?wins.map(({z,w})=>{const p=P(g,w.pid)||{};return`<tr><td><b>${PAT[z.k].name}</b><div class="sub">${esc(z.prize)}${w.share>1?' · shared equally':''}</div></td><td>${esc(w.name)}<div class="sub mono">${fmtNum(p.e164)}</div></td><td class="mono tiny">${p.ticket?tid(g,p):''}</td><td>${w.share}</td><td>Number ${w.num} (call ${w.callNo})</td><td>${fmtTs(w.at)}</td></tr>`}).join(''):'<tr><td colspan="6" class="muted">No prizes were won.</td></tr>'}</tbody></table></div>
  <label class="lb">Not awarded</label><div class="small">${g.prizes.filter(z=>!g.won[z.k]).map(z=>PAT[z.k].name).join(', ')||'All prizes were won.'}</div>
  <label class="lb">Players (${g.participants.length})</label><div class="tscroll" style="max-height:320px;overflow:auto"><table class="t"><thead><tr><th>Name</th><th>Mobile</th><th>Role</th><th>Joined through</th><th>Invited by</th><th>Status</th></tr></thead><tbody>${reportRows(g).map(r=>`<tr><td>${esc(r.name)}</td><td class="mono">${r.num}</td><td>${r.role}</td><td>${r.via}</td><td>${esc(r.by)||'—'}</td><td>${r.st}</td></tr>`).join('')}</tbody></table></div>
  <label class="lb">Numbers in the order they were called (${g.called.length})</label><div class="linkbox" style="border-style:solid">${g.called.join(', ')||'—'}</div>
  <div class="row" style="margin-top:14px"><button class="btn line" onclick="purge(G('${g.id}'));render();toast('24 hours passed. Personal data deleted.')">${ic('clock')} Prototype: jump 24 hours ahead (delete data)</button></div></div>`}

/* ---------- Team Lead ---------- */
function viewTL(g,p){const first=p.name.split(' ')[0];const cu=colleagueUsed(g,p),fu=familyUsed(g,p);const T=UI.tl;if(!T.cc)T.cc=g.country;
  const closed=!entryOpen(g),full=placesLeft(g)<1,cFull=cu>=p.cap,fFull=fu>=g.family;if(T.type==='family'&&fFull&&!cFull)T.type='colleague';if(T.type==='colleague'&&cFull&&!fFull)T.type='family';
  const r=T.num.trim()?normalize(T.num,T.cc):null;const dup=r&&r.ok&&numberInGame(g,r.e164);
  let hint=closed?`<p class="hint bad">Entry is closed. The game has started.</p>`:full?`<p class="hint bad">The game is full. No places left.</p>`:(T.type==='colleague'&&cFull)?`<p class="hint bad">You have used all ${p.cap} colleague passes. Ask the organizer for more.</p>`:
    !r?`<p class="hint">The pass will work only for this number.</p>`:!r.ok?`<p class="hint bad">${r.reason}</p>`:dup?`<p class="hint bad">This number is already in this game.</p>`:`<p class="hint good">Pass will be for ${fmtNum(r.e164)}</p>`;
  const mine=g.participants.filter(x=>x.invitedBy===p.id);
  return`<div class="wrap" style="max-width:860px"><div class="chead"><div><div class="eyebrow">Team Lead · ${esc(g.org)}</div><h1>${esc(first)}, bring in your team</h1><div class="stats">${esc(g.name)} · ${fmtDT(g.startsAt)} · ${statusPill(g)}</div></div><button class="btn line" onclick="openAsPerson('${g.id}','${p.id}')">${ic('ticket')} Open my ticket</button></div>
  <div class="panel"><div class="phead"><div class="step">1</div><div><h2>Create a pass</h2><p>Create a pass for each person. Each pass works on one phone only, so nobody else can use it.</p></div></div>
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px"><div class="meter"><span>Colleague passes</span><b>${cu} / ${p.cap}</b><div class="bar"><i style="width:${cu/p.cap*100}%"></i></div></div><div class="meter"><span>Family passes</span><b>${fu} / ${g.family}</b><div class="bar"><i style="width:${g.family?fu/g.family*100:100}%"></i></div></div><div class="meter"><span>Places left in the whole game</span><b>${placesLeft(g)}</b><div class="bar"><i style="width:${placesUsed(g)/g.limit*100}%"></i></div></div></div>
   <label class="lb">Who is this pass for?</label>${chips('Pass type',[['colleague','A colleague'],['family','My family member']],T.type,false,"tlType")}
   <div class="grid" style="margin-top:4px"><div><label class="lb" for="tlName">Their name</label><input class="inp" id="tlName" value="${esc(T.name)}" oninput="UI.tl.name=this.value"></div>
    <div><label class="lb" for="tlCc">Their country</label><select class="inp" id="tlCc" onchange="UI.tl.cc=this.value;render()">${countryOpts(T.cc)}</select></div>
    <div><label class="lb" for="tlNum">Their mobile number</label><input class="inp" id="tlNum" inputmode="tel" value="${esc(T.num)}" oninput="UI.tl.num=this.value;clearTimeout(window._tt);window._tt=setTimeout(()=>{render();const e=$('tlNum');e.focus();e.setSelectionRange(e.value.length,e.value.length)},350)">${hint}</div></div>
   <button class="btn" style="margin-top:12px" ${closed||full?'disabled':''} onclick="tlCreate()">Create pass</button>
   ${T.result?`<div class="note ok" style="display:block;margin-top:14px"><b>Pass ready for ${esc(T.result.name)}</b><div class="linkbox" style="margin:8px 0">${passLink(T.result)}</div><div class="row"><a class="btn sm" target="_blank" rel="noopener" href="${wa(T.result.e164,waMsg(g,T.result))}">Send to ${esc(T.result.name.split(' ')[0])} on WhatsApp</a><button class="btn sm line" onclick="copy(waMsg(G('${g.id}'),P(G('${g.id}'),'${T.result.id}')),'Link and message copied')">Copy link and message</button><button class="btn sm ghost" onclick="openPassOnNewPhone('${g.id}','${T.result.id}')">Prototype: open on their phone</button></div><p class="tiny muted" style="margin:6px 0 0">WhatsApp opens with the message ready. You press send.</p></div>`:''}
  </div>
  <div class="panel"><div class="phead"><div class="step">2</div><div><h2>Passes you created</h2><p>Cancel a pass that hasn't been used. If someone changes phones, issue them a new pass. The old one stops working.</p></div></div>
   ${mine.length?`<div class="tscroll"><table class="t"><thead><tr><th>Name</th><th>Mobile</th><th>Type</th><th>Status</th><th></th></tr></thead><tbody>${mine.map(x=>`<tr><td>${esc(x.name)}</td><td class="mono">${fmtNum(x.e164)}</td><td>${x.kind==='family'?'Family':'Colleague'}</td><td>${pStatus(x)}</td><td style="white-space:nowrap"><a class="btn sm line" target="_blank" rel="noopener" href="${wa(x.e164,waMsg(g,x))}">Resend on WhatsApp</a> <button class="btn sm line" onclick="copy(waMsg(G('${g.id}'),P(G('${g.id}'),'${x.id}')),'Copied')">${ic('copy')}</button> ${x.status==='joined'?`<button class="btn sm line" ${closed?'disabled':''} onclick="tlReissue('${x.id}')">New pass (changed phone)</button>`:`<button class="btn sm danger" ${closed?'disabled':''} onclick="tlCancel('${x.id}')">Cancel pass</button>`} <button class="btn sm ghost" onclick="openPassOnNewPhone('${g.id}','${x.id}')">${ic('phone')}</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted small">No passes yet.</p>'}</div></div>`}
function tlType(v){UI.tl.type=v;render()}
function tlCreate(){const g=G(R.gid),p=P(g,R.pid),T=UI.tl;const r=normalize(T.num,T.cc);if(!r.ok)return toast(r.reason);const x=createPass(g,p,{name:T.name,e164:r.e164,kind:T.type});if(!x.ok)return toast(x.reason);T.result=x.p;T.name='';T.num='';render()}
function tlCancel(id){const g=G(R.gid);const x=P(g,id);const e=cancelPass(g,x);if(e)return toast(e);render();toast(`Pass for ${x.name} cancelled. The place is free again.`,()=>{g.participants.push(x);x.pass.cancelled=false;DB._cancelled=DB._cancelled.filter(c=>c!==x.pass.code)})}
function tlReissue(id){const g=G(R.gid);const x=P(g,id);const e=reissuePass(g,x);if(e)return toast(e);render();toast(`New pass for ${x.name}. The old link and phone stopped working.`)}
</script>
<script>
/* =====================================================================
   PLAYER PHONE (players, Team Leads and family members all play here)
   ===================================================================== */
function dev(){let d=D(R.dev);if(!d){d=DB.devices.find(x=>x.real)||mkDevice('New phone');R.dev=d.id}return d}
function setScr(d,scr,ctx){d.scr=scr;d.ctx=Object.assign({},ctx||{});d.menu=false;render()}
function newPhone(label){const d=mkDevice(label||`Phone ${DB.devices.filter(x=>x.real).length+1}`);R.dev=d.id;return d}
function newPhoneLink(gid){const g=G(gid||R.gid)||DB.games[0];const d=newPhone();d.games.includes(g.id)||0;go({mode:'phone',dev:d.id,gid:g.id});setScr(d,'join',{gid:g.id,num:'',cc:g.country})}
function openPassOnNewPhone(gid,pid){const g=G(gid),p=P(g,pid);const d=newPhone(`${p.name.split(' ')[0]}'s phone`);go({mode:'phone',dev:d.id});phoneOpenPass(d,p.pass.code)}
function phoneOpenPass(d,codeS){const r=openPass(d,codeS);if(r.t==='pass')setScr(d,'pass',{gid:r.g.id,pid:r.p.id,code:codeS});else if(r.t==='game'){setScr(d,'game',{gid:r.g.id})}else setScr(d,'err',{k:r.k,gid:r.g&&r.g.id})}
function openAsPerson(gid,pid){const g=G(gid),p=P(g,pid);let d=p.device&&D(p.device);
  if(!d||!d.real){if(p.status==='joined'){d=newPhone(`${(p.name||'').split(' ')[0]||'Their'}'s phone`);p.device=d.id;d.bind={gid,pid};d.games.push(gid);go({mode:'phone',dev:d.id});setScr(d,'game',{gid});return}
    d=newPhone(`${(p.name||'').split(' ')[0]||'Their'}'s phone`);go({mode:'phone',dev:d.id});if(p.pass)return phoneOpenPass(d,p.pass.code);setScr(d,'join',{gid,num:p.e164,cc:g.country});return}
  go({mode:'phone',dev:d.id});setScr(d,'game',{gid})}
function myP(d){if(!d.bind)return null;const g=G(d.bind.gid);return g?P(g,d.bind.pid):null}

const ERRS={inuse:['phone','Already in use on another phone','This number or pass has already joined on another phone. Only one phone can play per number. Your organizer has been told and can move your entry to this phone.'],
  cancelled:['x','This pass was cancelled','The person who sent it cancelled this pass. Ask them to send you a new one.'],closed:['lock','Entry is closed','The game has started, so nobody new can join. Ask your organizer about the next game.'],
  full:['users','The game is full','This game has reached its player limit. Ask your organizer if a place can be freed.'],declined:['x','Request not accepted','The organizer did not admit this number for this game.'],
  rate:['clock','Too many tries','Please wait 10 minutes, or ask your organizer to check your number.'],badlink:['alert','This link does not work','Check the link your organizer sent you.'],
  usepass:['ticket','Use your personal pass','A personal pass was sent to this number. Open the pass link from your messages – you do not need to type your number.'],
  moved:['phone','This phone was logged out','Your entry was moved to another phone by the organizer. If that was not you, contact your organizer.'],deleted:['trash','This game has ended','Its data has been deleted.']};

function viewPhone(){const d=dev();return`<div class="phonewrap"><div class="phone"><div class="pbar"><span>${fmtT(now())}</span><span>${esc(d.label)}</span><span>5G ▮▮▮</span></div><div class="purl mono" id="pUrl">${phoneURL(d)}</div><div class="pscr" id="pScr">${phoneScreen(d)}</div></div>
  <aside class="pside"><div class="panel" id="pSide">${phoneSide(d)}</div></aside></div>`}
function phoneURL(d){const c=d.ctx||{};const g=c.gid&&G(c.gid);if(d.scr==='pass'||(d.scr==='err'&&c.code))return`${CFG.DOMAIN}/p/${c.code||''}`;if(g&&['join','consent','ask','wait','game'].includes(d.scr))return`${CFG.DOMAIN}/g/${g.code}`;return CFG.DOMAIN}
function phoneSide(d){const passes=DB.games.flatMap(g=>g.participants.filter(p=>p.status==='pass_sent').map(p=>({g,p})));const g=G((d.ctx&&d.ctx.gid)||R.gid)||DB.games[0];
  const cand=g?g.participants.filter(p=>p.status==='not_joined').slice(0,6):[];const me=myP(d);
  return`<div class="eyebrow">Prototype controls</div><p class="tiny muted" style="margin:4px 0 10px">Real players only ever tap a link. These buttons stand in for that.</p>
  <label class="lb" style="margin-top:0">Open a game link</label>${DB.games.filter(x=>x.status!=='purged').map(x=>`<button class="btn sm line block" style="margin-bottom:6px;justify-content:flex-start" onclick="setScr(dev(),'join',{gid:'${x.id}',cc:'${x.country}',num:''})">${ic('link')} ${esc(x.name)}</button>`).join('')}
  ${passes.length?`<label class="lb">Open a personal pass</label><select class="inp" onchange="if(this.value)phoneOpenPass(dev(),this.value)"><option value="">Choose a pass…</option>${passes.map(({g,p})=>`<option value="${p.pass.code}">${esc(p.name)} (${p.kind}) · ${esc(g.name)}</option>`).join('')}</select>`:''}
  ${cand.length?`<label class="lb">Numbers on the list (not joined yet)</label><div class="tiny">${cand.map(p=>`<div><button class="linkbtn" onclick="setScr(dev(),'join',{gid:'${g.id}',cc:'${g.country}',num:'${p.e164}'})">${esc(p.name)} · <span class="mono">${fmtNum(p.e164)}</span></button></div>`).join('')}</div><p class="tiny muted">Any other valid number goes to the waiting room.</p>`:''}
  ${me?`<label class="lb">Second phone test</label><button class="btn sm line block" onclick="secondPhone()">Open ${esc(me.name.split(' ')[0])}'s number on another phone</button>`:''}
  <label class="lb">This phone</label><button class="btn sm line block" onclick="newPhone();setScr(dev(),'home')">+ Use a brand-new phone</button>`}
function secondPhone(){const d0=dev(),me=myP(d0);const g=G(d0.bind.gid);const d=newPhone('Second phone');go({dev:d.id});if(me.pass)phoneOpenPass(d,me.pass.code);else{const r=joinByNumber(g,d,me.e164);setScr(d,'err',{k:r.k||'inuse',gid:g.id})}}

function phoneScreen(d){const c=d.ctx||{};const g=c.gid&&G(c.gid);
  if(d.kicked&&!d.bind&&d.scr==='game'){return errCard('moved')}
  switch(d.scr){
  case'join':{if(!g)return errCard('badlink');if(g.status==='purged')return errCard('deleted');if(g.status!=='open')return errCard('closed',g);const r=c.num?normalize(c.num,c.cc||g.country):null;
    return`${ptop(d)}<div class="pcard"><div class="eyebrow">${esc(g.org)}</div><h2>${esc(g.name)}</h2><p class="lead">Starts ${when(g.startsAt)} (your local time). Entry closes when the game starts.</p>
    <label class="lb" for="jCc">Country</label><select class="inp" id="jCc" onchange="dev().ctx.cc=this.value;render()">${countryOpts(c.cc||g.country)}</select>
    <label class="lb" for="jNum">Your mobile number</label><div class="phonein"><span>+${dialOf(c.cc||g.country)}</span><input id="jNum" inputmode="tel" autocomplete="tel" value="${esc(c.num||'')}" placeholder="98765 43210" oninput="dev().ctx.num=this.value;jHint()" onkeydown="if(event.key==='Enter')doJoin()"></div>
    <p class="hint ${r?(r.ok?'good':'bad'):''}" id="jHint">${r?(r.ok?'We will check '+fmtNum(r.e164):r.reason):'Enter the number your organizer has for you. Any format works.'}</p><div id="jErr"></div>
    <button class="btn block" style="margin-top:12px" onclick="doJoin()">Join game ${ic('arrow')}</button>
    <p class="tiny muted">No SMS or code is sent. Your number is only checked against the organizer's list and deleted within 24 hours after the game.</p></div>`}
  case'consent':{const p=P(g,c.pid);if(!p)return errCard('badlink');return`${ptop(d)}<div class="pcard"><div class="eyebrow">You're on the list</div><h2>Welcome${p.name?', '+esc(p.name.split(' ')[0]):''}</h2><p class="lead">Check your name. It appears on your ticket and on the winners list.</p>
    <label class="lb" for="cName">Your name</label><input class="inp" id="cName" maxlength="30" value="${esc(p.name)}" placeholder="e.g. Priya Sharma">
    <label class="cb" style="border:1px solid var(--line);border-radius:12px;padding:12px"><input type="checkbox" id="cOk"><span>I agree to join. My name and mobile number are used only to run this game and are <b>deleted within 24 hours</b> after the game. <button class="linkbtn" onclick="privacy()">Privacy notice</button></span></label><div id="cErr"></div>
    <button class="btn block" onclick="doConsent()">Join game ${ic('arrow')}</button><p class="tiny muted">This phone is now your ticket. If you open the game on another phone, it will be blocked.</p></div>`}
  case'ask':return`${ptop(d)}<div class="pcard"><div class="eyebrow">Not on the list yet</div><h2>Ask to join</h2><p class="lead"><span class="mono">${fmtNum(c.e164)}</span> is not on the organizer's list. Send a request and they can let you in.</p>
    <label class="lb" for="aName">Your name</label><input class="inp" id="aName" maxlength="30" placeholder="So the organizer knows you"><label class="lb" for="aInfo">Department or flat (optional)</label><input class="inp" id="aInfo" maxlength="30" placeholder="e.g. Finance, or B-402">
    <label class="cb"><input type="checkbox" id="aOk"><span>I agree that my name and number are shared with the organizer for this game and <b>deleted within 24 hours</b> after it.</span></label><div id="aErr"></div>
    <button class="btn block" onclick="doAsk()">Ask to join ${ic('arrow')}</button><p class="center"><button class="linkbtn" onclick="setScr(dev(),'join',{gid:'${g.id}',cc:'${c.cc||g.country}',num:''})">Use a different number</button></p></div>`;
  case'wait':{const p=g&&g.participants.find(x=>x.e164===c.e164&&x.device===d.id);if(p){setTimeout(()=>{setScr(d,'game',{gid:g.id});toast('The organizer let you in')},0);return''}
    if(d.declined===g.id)return errCard('declined');if(g.status!=='open')return errCard('closed',g);
    return`${ptop(d)}<div class="pcard center"><div class="res">${ic('clock')}</div><h2>Your request is with the organizer</h2><p class="lead">Keep this page open. You'll get in as soon as they admit you. Entry closes when the game starts.</p><div class="waitdots"><i></i><i></i><i></i></div>
    <p class="tiny muted">Prototype: switch to the Organizer or Host view (top bar) and admit or decline ${esc(c.e164?fmtNum(c.e164):'')}.</p></div>`}
  case'pass':{const p=g&&P(g,c.pid);if(!p||!p.pass||p.pass.code!==c.code)return errCard('cancelled');if(p.status==='joined'&&p.device!==d.id)return errCard('inuse');if(g.status!=='open')return errCard('closed',g);const s=P(g,p.invitedBy);
    return`${ptop(d)}<div class="pcard"><div class="eyebrow">Your personal pass</div><h2>Hi ${esc(p.name.split(' ')[0])}, this is your pass for <em>${esc(g.name)}</em></h2><p class="lead">Sent by <b>${esc(s?s.name:'the organizer')}</b>${s&&s.role==='team_lead'?' (Team Lead':''}${s&&s.role==='team_lead'?', '+esc(g.org)+')':''}. It works on one phone only, so please don't forward it.</p>
    <div class="passbox"><span>Pass for</span><b class="mono">${fmtNum(p.e164)}</b><span>Starts ${when(g.startsAt)}</span></div>
    <label class="cb"><input type="checkbox" id="pOk"><span>I agree to join. My number is <b>deleted within 24 hours</b> after the game. <button class="linkbtn" onclick="privacy()">Privacy notice</button></span></label><div id="pErr"></div>
    <button class="btn block" onclick="doPass()">Join game ${ic('arrow')}</button></div>`}
  case'err':return errCard(c.k,g);
  case'game':return gameScreen(d);
  default:return homeScreen(d)}}
function ptop(d,back){const me=myP(d);return`<div class="ptop">${back?`<button class="btn sm ghost" onclick="setScr(dev(),'home')" aria-label="Back">${ic('back')}</button>`:''}<span class="mark">${ic('ticket')}</span><span class="word">Tambola<i>.</i></span>${me&&d.scr==='game'?`<button class="av" onclick="dev().menu=!dev().menu;render()" aria-label="Menu">${initials(me.name)}</button>`:''}</div>`}
function errCard(k,g){const[i,t,x]=ERRS[k]||ERRS.badlink;return`${ptop(dev())}<div class="pcard center"><div class="res no">${ic(i)}</div><h2>${t}</h2><p class="lead">${x}</p><button class="btn line block" onclick="setScr(dev(),'home')">Back</button></div>`}
function homeScreen(d){const gs=d.games.map(G).filter(Boolean);
  return`${ptop(d)}<div class="eyebrow">Private game · by invitation</div><h2 style="font:600 28px/1.1 var(--serif);margin:6px 0 8px">Tambola, <em style="color:var(--goldd)">beautifully</em> simple.</h2>
  <p class="muted">Your company, society or group invited you to play. Open the link they sent you, enter your mobile number, and you are in. No app, no SMS, no password.</p>

    money:['Money & your data',L([`Free to play. You never pay on this platform.`,`Prizes are given directly by ${esc(g.org)}. We do not handle money.`,`Your name and number are deleted within 24 hours after the game ends.`,`No SMS, no email, no location, no contacts.`])],
    disc:['Disclaimer',L([`Private game for a closed group invited by ${esc(g.org)}. We only provide the software; we do not organize the game or give prizes.`,`The game runs in one stretch. It pauses only for claim checks, brand breaks set up before the start, or an emergency.`,`Where local law restricts games like this, ${esc(g.org)} is responsible for checking the game is allowed.`])],
    ticket:['This ticket',`<div class="sum"><div class="kv"><span>Ticket ID</span><b class="mono tiny">${tid(g,p)}</b></div><div class="kv"><span>Player</span><b>${esc(p.name)}</b></div><div class="kv"><span>Mobile</span><b class="mono">${maskNum(p.e164)}</b></div><div class="kv"><span>Joined through</span><b>${p.source==='list'?'Game link':p.source==='pass'?'Personal pass':'Waiting room'}</b></div><div class="kv"><span>Wrong claims</span><b>${p.bogeys} of 2</b></div><div class="kv"><span>Organizer contact</span><b>${esc(orgOf(g)?orgOf(g).name:g.org)}</b></div></div>`]}[k];
  sheet(`<h2>${S[0]}</h2>${S[1]}<button class="btn block" onclick="closeSheet()">Close</button>`)}
/* engine hooks: voice for the phone being viewed, and personal claim results */
function onDraw(g,n){if(R.mode==='phone'){const d=dev();if(d.bind&&d.bind.gid===g.id&&d.ctx.gid===g.id&&d.scr==='game'&&d.voice&&g.callMode!=='manual')speak(line(n,g.lang),g.lang)}}
function onResult(g,results){if(R.mode!=='phone')return;const d=dev();const me=myP(d);if(!me||d.bind.gid!==g.id)return;const r=results.find(x=>x.p.id===me.id);if(!r)return;d.pending=false;
  sheet(r.ok?`<div class="res ok">${ic('trophy')}</div><h2 class="center">${r.fun?'Valid claim!':'Congratulations!'}</h2><p class="center muted">${r.fun?`Your ${PAT[r.k].name} is valid. In this game family members play for fun, so no prize.`:`You won <b>${PAT[r.k].name}</b>. ${esc(g.org)} will contact you and give the prize directly.`}</p><button class="btn block" onclick="closeSheet()">Back to game</button>`
   :`<div class="res no">${ic('x')}</div><h2 class="center">Not a valid claim</h2><p class="center muted">${esc(r.why)}<br>Wrong claims: ${me.bogeys} of 2.${me.blocked?' Your ticket is now blocked.':''}</p><button class="btn block" onclick="closeSheet()">Back to game</button>`)}
</script>
<script>
/* =====================================================================
   NAVIGATOR (prototype bar) + ROUTER + LIVE UPDATES
   ===================================================================== */
let R={mode:'site',role:'org',gid:'DW26',pid:null,dev:null};
function go(o){Object.assign(R,o);if(o.mode&&o.mode!=='phone')closeSheet();if(o.role&&!o.pid&&o.role!==R._lastRole){R.pid=null}R._lastRole=R.role;
  if(R.mode==='console'&&R.role==='org'){const g=G(R.gid);if(g&&(!DB.session||DB.session.orgId!==g.orgId))DB.session={orgId:g.orgId}}
  render();window.scrollTo(0,0)}
function scenario(k,quiet){seed(k);UI={...UI,check:null,sel:new Set(),qsel:new Set(),ck1:false,ck2:false,tl:{type:'colleague',name:'',cc:null,num:'',result:null}};R.gid=DB.games[0].id;R.pid=null;R.dev=(DB.devices.find(d=>d.real&&d.bind)||{}).id||null;
  const d=D(R.dev);if(d)d.scr='game',d.ctx={gid:R.gid};if(!quiet)toast({fresh:'Scenario: a new organizer has just bought a game.',ready:'Scenario: game ready to start – list added, people joined, waiting room and a phone alert.',live:'Scenario: game in progress.',ended:'Scenario: game ended – report available.'}[k]);render()}
function curGame(){return G(R.gid)||DB.games[0]}
function navHTML(){const g=curGame();const hosts=g?g.participants.filter(p=>p.role==='host'):[],tls=g?g.participants.filter(p=>p.role==='team_lead'):[];const real=DB.devices.filter(d=>d.real);
  const V=[['site','Website'],['how','How it works'],['org','Organizer'],['host','Host'],['tl','Team Lead'],['phone','Player phone']];const cur=R.mode==='console'?R.role:R.mode;
  const st=g?(g.status==='started'?`call ${g.called.length}/90`:g.status):'';
  return`<div class="row"><b class="lbl">Prototype</b><span class="seg">${V.map(([k,l])=>`<button class="${cur===k?'on':''}" onclick="navTo('${k}')">${l}</button>`).join('')}</span>
   ${['console','phone'].includes(R.mode)?`<select aria-label="Game" onchange="go({gid:this.value,pid:null})">${DB.games.map(x=>`<option value="${x.id}" ${g&&x.id===g.id?'selected':''}>${esc(x.name)} · ${x.status}</option>`).join('')}</select>`:''}
   ${R.mode==='console'&&R.role==='host'&&hosts.length?`<select aria-label="Which host" onchange="go({pid:this.value})">${hosts.map(p=>`<option value="${p.id}" ${p.id===R.pid?'selected':''}>Host: ${esc(p.name)}</option>`).join('')}</select>`:''}
   ${R.mode==='console'&&R.role==='tl'&&tls.length?`<select aria-label="Which team lead" onchange="go({pid:this.value})">${tls.map(p=>`<option value="${p.id}" ${p.id===R.pid?'selected':''}>Team Lead: ${esc(p.name)}</option>`).join('')}</select>`:''}
   ${R.mode==='phone'?`<select aria-label="Which phone" onchange="if(this.value==='+'){newPhone();setScr(dev(),'home')}else go({dev:this.value})">${real.map(d=>{const p=myP(d);return`<option value="${d.id}" ${d.id===R.dev?'selected':''}>${esc(d.label)}${p?' · '+esc(p.name):''}</option>`}).join('')}<option value="+">+ New phone</option></select>`:''}
   <span class="sp"></span><span class="gstat hide-m">${g?esc(g.id)+' · '+st:''}</span>
   <select aria-label="Scenario" onchange="if(this.value)scenario(this.value);this.value=''"><option value="">Reset to a scenario…</option><option value="fresh">1 · Just bought (empty game)</option><option value="ready">2 · Ready to start</option><option value="live">3 · Game in progress</option><option value="ended">4 · Game ended</option></select>
   <select class="hide-m" aria-label="Speed" onchange="SPEED=+this.value;const x=curGame();if(x&&x.nextAt)x.nextAt=now()+CFG.AI_GAP*SPEED"><option value="1" ${SPEED===1?'selected':''}>Real speed (10 s)</option><option value="0.35" ${SPEED!==1?'selected':''}>Fast (3.5 s)</option></select></div>`}
function navTo(k){if(k==='site'||k==='how')return go({mode:k});if(k==='phone'){dev();return go({mode:'phone'})}go({mode:'console',role:k,pid:null})}
function render(){$('nav').innerHTML=navHTML();const m=$('main');let h='';
  if(R.mode==='site')h=viewSite();else if(R.mode==='how')h=viewHow();else if(R.mode==='console')h=viewConsole();else if(R.mode==='phone')h=viewPhone();
  m.innerHTML=h;m._sig=sig();if(R.mode==='console'){const g=G(R.gid);if(g&&g.status==='open')setTimeout(()=>drawQR(gameLink(g)),0)}}
function sig(){const g=G(R.gid);let s=R.mode+R.role+(g?g.status+'|'+g.participants.length+'|'+g.waiting.length+'|'+g.conflicts.filter(c=>!c.done).length+'|'+g.breaks.filter(b=>b.done).length+'|'+JSON.stringify(Object.keys(g.won))+(g.paused?g.paused.type:''):'');
  if(R.mode==='phone'){const d=D(R.dev);if(d){const pg=G(d.ctx&&d.ctx.gid);s+='|'+d.scr+'|'+(d.bind?d.bind.pid:'')+'|'+(d.kicked?1:0)+'|'+(d.declined||'')+(pg?'|'+pg.status+'|'+pg.participants.length+'|'+(pg.paused?pg.paused.type:'')+'|'+JSON.stringify(Object.keys(pg.won))+'|'+pg.waiting.length:'')}}return s}
let _lu=0;
function liveUpdate(force){const m=$('main');if(!m)return;const typing=document.activeElement&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&m.contains(document.activeElement);
  if(sig()!==m._sig&&!typing&&$('modal').classList.contains('hidden')){render();return}
  $('nav').querySelector('.gstat')&&(()=>{const g=curGame();$('nav').querySelector('.gstat').textContent=g?g.id+' · '+(g.status==='started'?`call ${g.called.length}/90`:g.status):''})();
  if(R.mode==='console'){const g=G(R.gid);if(g&&g.status==='started'){patch('lvCaller',callerHTML(g));patch('lvPrizes',prizesHTML(g));patch('lvLog',logHTML(g));patch('lvBog',bogHTML(g));patch('lvPause',pauseBtns(g))}}
  if(R.mode==='phone'){const d=D(R.dev);if(d&&d.scr==='game'){const g=G(d.ctx.gid),p=myP(d);if(g&&p){patch('pStrip',stripHTML(g,d,p));patch('pMedia',mediaHTML(g));patch('pStub',stubHTML(g,p))}}}}
setInterval(tick,250);
/* ---------- start ---------- */
scenario('ready',1);R.mode='site';render();
if(window.speechSynthesis)speechSynthesis.getVoices();
</script>
