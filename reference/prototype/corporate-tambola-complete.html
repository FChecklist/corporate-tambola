<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corporate Tambola – complete prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--wine:#5A1426;--wine2:#7A1C33;--deep:#2E0812;--gold:#E0B872;--gold2:#F3D9A4;--goldd:#B8894D;--ivory:#FBF6EC;--bg:#F6F1E7;--surface:#fff;--sunk:#F3ECE0;--ink:#1C1014;--ink2:#3B2E33;--muted:#6F6166;--faint:#A0949A;--line:#E8DDCC;--line2:#F1EADF;
  --ok:#1F7A55;--okbg:#E4F3EC;--warn:#8A5A00;--warnbg:#FBF0D9;--bad:#B3261E;--badbg:#FBE7E4;--info:#1F4E8C;--infobg:#E6EEF9;
  --serif:"Fraunces",Georgia,serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(28,16,20,.05),0 14px 34px -22px rgba(28,16,20,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--wine)}
.hidden{display:none!important}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3.5px;flex:0 0 auto}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.center{text-align:center}
.eyebrow{font:600 10.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--goldd)}
:focus-visible{outline:2px solid var(--goldd);outline-offset:2px}

/* ---------- prototype navigator ---------- */
#nav{position:sticky;top:0;z-index:50;background:#140509;color:#EBD9DE;font-size:12.5px;border-bottom:1px solid #3a1420}
#nav .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:7px 12px;max-width:1400px;margin:0 auto}
#nav b.lbl{font:700 9.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
#nav .seg{display:inline-flex;background:#2a0d15;border:1px solid #4a1d29;border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
#nav .seg button{border:0;background:transparent;color:#EBD9DE;border-radius:7px;padding:5px 8px;font-weight:600;font-size:12px}
#nav .seg button.on{background:var(--gold);color:var(--deep)}
#nav select,#nav .nb{background:#2a0d15;color:#EBD9DE;border:1px solid #4a1d29;border-radius:8px;padding:5px 8px;font-size:12px;max-width:190px}
#nav .nb{font-weight:600}
#nav .nb:hover{border-color:var(--gold)}
#nav .sp{flex:1}
#nav .gstat{font-family:var(--mono);color:var(--gold2)}
@media (max-width:760px){#nav .row{padding:6px 10px}#nav .hide-m{display:none}}

/* ---------- common UI ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:18px 16px 70px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--wine);color:#fff;text-decoration:none;line-height:1.2;min-height:40px}
.btn:hover{background:var(--wine2)}
.btn.gold{background:linear-gradient(180deg,#E6C58A,#C9A45F);color:var(--deep)}
.btn.line{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.line:hover{border-color:var(--ink)}
.btn.danger{background:var(--surface);color:var(--bad);border:1px solid #E8B4AE}
.btn.ghost{background:transparent;color:var(--wine);padding:6px 8px;min-height:32px}
.btn.sm{padding:7px 11px;font-size:13px;min-height:34px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled,.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{border:0;background:none;color:var(--wine);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:2px 0;font-size:inherit}
label.lb{display:block;font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;background:#FDFBF7;outline:none;color:var(--ink)}
.inp:focus{border-color:var(--wine);background:#fff}
select.inp{appearance:auto}
textarea.inp{min-height:130px;font:500 13px/1.5 var(--mono)}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}.hint.good{color:var(--ok)}.hint.bad{color:var(--bad)}
.err{display:flex;gap:8px;align-items:flex-start;background:var(--badbg);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:12px 0 0}
.note{display:flex;gap:8px;align-items:flex-start;background:var(--sunk);color:var(--ink2);border-radius:10px;padding:10px 12px;font-size:13px;margin:12px 0 0}
.note.warn{background:var(--warnbg);color:var(--warn)}.note.ok{background:var(--okbg);color:var(--ok)}.note.info{background:var(--infobg);color:var(--info)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.chip.on{border-color:var(--wine);background:#F8E9EC;color:var(--wine);box-shadow:0 0 0 1px var(--wine) inset}
.chip:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.info{background:var(--infobg);color:var(--info)}.pill.wine{background:#F8E9EC;color:var(--wine)}
.cb{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink2);margin:10px 0}
.cb input{width:18px;height:18px;margin-top:2px;accent-color:var(--wine);flex:0 0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:4px 18px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font:600 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;background:var(--sunk);border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-top:1px solid var(--line2);vertical-align:middle}
table.t td.mono{white-space:nowrap}table.t td .sub{font-size:12px;color:var(--muted)}
table.t select{border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:13px;background:#fff}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.linkbox{font:500 13px var(--mono);background:var(--sunk);border:1px dashed var(--goldd);border-radius:10px;padding:10px 12px;word-break:break-all;user-select:all}
.meter{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.meter span{font-size:12px;color:var(--muted)}.meter b{display:block;font:600 22px var(--mono);margin:2px 0 6px}
.meter .bar{height:7px;border-radius:7px;background:var(--sunk);overflow:hidden}.meter .bar i{display:block;height:100%;background:var(--wine);border-radius:7px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}

/* toast + sheet */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:flex;gap:10px;align-items:center;background:var(--ink);color:#fff;border-radius:12px;padding:11px 14px;font-size:13.5px;box-shadow:0 20px 40px -18px rgba(0,0,0,.6);max-width:min(560px,calc(100vw - 32px))}
#toast button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:4px 10px;font-weight:600}
.modal{position:fixed;inset:0;z-index:80;background:rgba(20,5,10,.5);backdrop-filter:blur(3px);display:grid;place-items:end center}
.sheet{background:#fff;width:100%;max-width:540px;border-radius:22px 22px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s ease-out}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet h2{font:600 23px/1.2 var(--serif);margin:6px 0 10px}
@media(min-width:720px){.modal{place-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
.sum{border:1px solid var(--line);border-radius:12px;padding:2px 14px;margin:10px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line2);font-size:14px}
.kv:first-child{border-top:0}.kv span{color:var(--muted)}.kv.t{font-weight:700;font-size:15.5px}.kv.t span{color:var(--ink)}
.res{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;margin:4px auto 12px;background:var(--sunk);color:var(--wine)}
.res .ic{width:30px;height:30px}.res.ok{background:var(--okbg);color:var(--ok)}.res.no{background:var(--badbg);color:var(--bad)}
.pm{display:grid;gap:8px;margin:6px 0}
.pm button{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;text-align:left;font-weight:600}
.pm button.on{border-color:var(--wine);box-shadow:0 0 0 1px var(--wine)}
.pm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.proto{font-size:11.5px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin-top:12px;text-align:center}
.facts{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.facts li{display:flex;gap:10px;font-size:13.5px}.facts .ic{color:var(--wine);width:16px;height:16px;margin-top:2px}

/* ---------- landing (one screen) ---------- */
.site{min-height:calc(100vh - 42px);min-height:calc(100dvh - 42px);display:grid;grid-template-rows:auto 1fr auto;color:var(--ivory);
  background:radial-gradient(1000px 600px at 78% 45%,rgba(224,184,114,.2),transparent 60%),radial-gradient(700px 500px at 0% 0%,#8E2240 0%,transparent 60%),linear-gradient(135deg,#3A0B18,#5A1426 55%,#3A0B18);position:relative;overflow:hidden}
.site::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 2px,transparent 2px 14px);pointer-events:none}
.sin{width:100%;max-width:1320px;margin:0 auto;padding:0 clamp(16px,3vw,40px);position:relative;z-index:1}
.snav{display:flex;align-items:center;gap:12px;padding:clamp(10px,2vh,18px) 0}
.mark{width:34px;height:34px;border-radius:9px;background:var(--gold);color:var(--wine);display:grid;place-items:center;flex:0 0 34px}
.brandtx{display:flex;flex-direction:column;line-height:1.15}
.word{font:600 21px var(--serif)}.word i{font-style:normal;color:var(--gold)}
.tag{font:500 12px var(--sans);color:var(--gold2);margin-top:2px}
.snav .links{margin-left:auto;display:flex;gap:8px;align-items:center}
.snav .links a,.snav .links button{font:600 13px var(--sans);color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:8px 14px;background:transparent}
.snav .links .how{background:var(--gold);color:var(--deep);border-color:var(--gold)}
.smain{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.12fr);gap:clamp(20px,2.8vw,48px);align-items:center;padding-bottom:clamp(10px,2vh,24px)}
.site .eyebrow{color:var(--gold)}
.site h1{font:600 clamp(34px,min(4.6vw,7.4vh),64px)/1.03 var(--serif);letter-spacing:-.02em;margin:clamp(6px,1.2vh,12px) 0 clamp(12px,2vh,20px)}
.site h1 em{display:block;font-style:italic;color:var(--gold)}
.acts{list-style:none;margin:0;padding:0;display:grid;gap:clamp(4px,.9vh,8px)}
.acts li{display:flex;align-items:center;gap:12px;font:600 clamp(17px,min(1.6vw,2.8vh),22px)/1.2 var(--serif)}
.acts .b{width:clamp(30px,4.4vh,36px);height:clamp(30px,4.4vh,36px);border-radius:50%;display:grid;place-items:center;background:rgba(224,184,114,.16);color:var(--gold);border:1px solid rgba(224,184,114,.4)}
.acts .b .ic{width:16px;height:16px}
.three{display:flex;gap:8px;flex-wrap:wrap;margin-top:clamp(10px,1.8vh,16px)}
.three span{font:700 11.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:7px 13px;border-radius:999px;background:var(--ivory);color:var(--wine)}
.three span:nth-child(2){background:var(--gold);color:var(--deep)}.three span:nth-child(3){background:transparent;color:var(--gold2);border:1px solid var(--gold)}
.buy{margin-top:clamp(12px,2.2vh,22px);background:var(--ivory);color:var(--ink);border-radius:18px;padding:clamp(10px,1.6vh,14px);box-shadow:0 24px 50px -24px rgba(0,0,0,.6);max-width:560px}
.buytop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 8px;font:600 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cur{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.cur button{border:0;background:transparent;font:600 11px var(--sans);padding:4px 10px;color:var(--muted)}.cur button.on{background:var(--wine);color:#fff}
.buyrow{display:flex;flex-wrap:wrap;gap:8px 10px}.buyrow .btn{flex:1 1 auto;padding:13px 15px;font-size:15px}
.selwrap{position:relative;flex:1 1 250px;min-width:0}
.selwrap select{appearance:none;-webkit-appearance:none;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px 34px 12px 12px;font:600 14px var(--sans);background:#fff;color:var(--ink)}
.selwrap .chev{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--wine)}
.brk{display:flex;flex-wrap:wrap;gap:2px 14px;margin:9px 2px 0;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}.brk b{color:var(--ink);font-weight:600}
.def{font-size:11px;color:var(--muted);margin:3px 2px 0}
.who{min-width:170px}
.who ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:clamp(2px,.6vh,6px)}
.who li{font:600 clamp(15px,min(1.3vw,2.5vh),19px)/1.35 var(--sans);color:#EBD9DE;display:flex;align-items:center;gap:10px;transition:color .3s,transform .3s}
.who li::before{content:"";width:7px;height:7px;border-radius:50%;background:rgba(224,184,114,.45)}
.who li.on{color:#fff;transform:translateX(4px)}.who li.on::before{background:var(--gold);box-shadow:0 0 0 4px rgba(224,184,114,.25)}
.eq{margin-top:clamp(12px,2.2vh,20px);padding-top:clamp(10px,1.8vh,16px);border-top:1px solid rgba(224,184,114,.3);display:grid;gap:clamp(6px,1.1vh,10px)}
.eq p{margin:0;line-height:1.25}.eq b{display:block;font:600 italic clamp(16px,min(1.3vw,2.5vh),19px) var(--serif);color:var(--gold)}.eq span{font-size:13px;color:#EBD9DE}
.svis{display:flex;justify-content:center}
.tkt{position:relative;width:100%;max-width:min(720px,calc((100vh - 200px) * 1.59))}
.tkt img{display:block;width:100%;height:auto;border-radius:14px;box-shadow:0 50px 90px -40px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.08);transform:rotate(-1.5deg)}
.call{position:absolute;display:flex;align-items:center;gap:10px;background:#fff;color:var(--ink);border-radius:14px;padding:10px 13px;box-shadow:0 20px 40px -18px rgba(0,0,0,.7);font-size:12.5px;line-height:1.3;max-width:260px}
.call b{display:block;font:600 14px var(--serif)}.call .d{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;background:var(--wine);color:var(--gold)}
.c1{left:-4%;bottom:10%;animation:bob 5s ease-in-out infinite}.c1 .d{background:var(--gold);color:var(--wine)}
.c2{right:-3%;bottom:-7%;animation:bob 5s ease-in-out -2.5s infinite}
.play{position:relative;display:block}.play::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--wine) var(--p,30%),#EADFCF 0)}
@keyframes bob{50%{transform:translateY(-7px)}}
.strip{border-top:1px solid rgba(224,184,114,.25);background:rgba(0,0,0,.18)}
.strip .sin{display:flex;justify-content:space-between;gap:14px;padding-top:clamp(9px,1.6vh,14px);padding-bottom:clamp(9px,1.6vh,14px)}
.strip span{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#EBD9DE;line-height:1.3}.strip span span{display:inline}
.strip .ic{color:var(--gold);width:17px;height:17px}.strip b{color:#fff;font-weight:600}
@media (min-width:961px){.strip span{white-space:nowrap}}
@media (max-width:960px){.site{min-height:0}.smain{grid-template-columns:1fr;gap:30px;padding:8px 0 30px}.strip .sin{display:grid;grid-template-columns:1fr 1fr}
  .who ul{display:flex;flex-wrap:wrap;gap:8px}.who li{font-size:13px;padding:6px 12px;border:1px solid rgba(224,184,114,.4);border-radius:999px}.who li::before{display:none}.who li.on{transform:none;background:rgba(224,184,114,.18)}.eq{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.site h1{font-size:34px}.snav .tag{display:none}.snav .links a.login{display:none}.buyrow{flex-direction:column}.selwrap{flex:none}.call{font-size:11px;padding:8px 10px;max-width:200px}.call b{font-size:12.5px}.c1{left:-2%;bottom:-10%}.c2{right:-2%;top:-14%;bottom:auto}.strip .sin{grid-template-columns:1fr}.eq{grid-template-columns:1fr}}

/* ---------- how it works ---------- */
.how{background:var(--ivory)}
.howhero{background:linear-gradient(135deg,#3A0B18,#5A1426);color:var(--ivory);padding:34px 0 30px}
.howhero h1{font:600 clamp(30px,4vw,46px)/1.1 var(--serif);margin:8px 0 10px}.howhero p{max-width:720px;color:#EBD9DE;margin:0}
.howhero .eyebrow{color:var(--gold)}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.toc a{font:600 12.5px var(--sans);color:var(--gold2);border:1px solid rgba(224,184,114,.45);border-radius:999px;padding:6px 12px;text-decoration:none}
.hstep{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:34px;align-items:center;padding:38px 0;border-bottom:1px solid var(--line)}
.hstep:nth-child(even) .htext{order:2}
.hnum{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--wine);color:var(--gold2);font:600 14px var(--sans);margin-bottom:10px}
.hstep h2{font:600 26px/1.2 var(--serif);margin:0 0 8px}.hstep .who2{font:700 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--goldd)}
.hstep ul{margin:10px 0 14px;padding-left:18px;color:var(--ink2)}.hstep li{margin:4px 0}
.hshot{border-radius:14px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);background:#fff}
.hshot img{display:block;width:100%;height:auto}
.hshot.phone{max-width:320px;margin:0 auto;border-radius:26px;border:8px solid #1c1014}
.hshots{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:860px){.hstep{grid-template-columns:1fr;gap:18px}.hstep:nth-child(even) .htext{order:0}}

/* ---------- consoles ---------- */
.chead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.chead h1{font:600 22px var(--serif);margin:0}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}.stats b{font-family:var(--mono);color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.phead{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.step{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;background:var(--wine);color:var(--gold2);font:600 13px var(--sans)}
.phead h2{font:600 19px var(--serif);margin:2px 0 2px}.phead p{margin:0;color:var(--muted);font-size:13.5px}

function initials(s){return(s||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()}
const plural=(n,a,b)=>n+' '+(n===1?a:(b||a+'s'));

/* ---------- toast (with Undo) + sheet (no browser alert/confirm anywhere) ---------- */
let toastT=null;
function toast(msg,undo){const t=$('toast');t.innerHTML=`<span>${msg}</span>`+(undo?'<button id="undoB">Undo</button>':'');t.classList.remove('hidden');clearTimeout(toastT);
  if(undo)$('undoB').onclick=()=>{undo();t.classList.add('hidden');render()};toastT=setTimeout(()=>t.classList.add('hidden'),undo?7000:3200)}
function sheet(h){$('sheet').innerHTML=h;$('modal').classList.remove('hidden')}
function closeSheet(){$('modal').classList.add('hidden')}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet()});
function copy(t,msg){try{navigator.clipboard.writeText(t)}catch(e){}toast(msg||'Copied')}

/* ---------- countries + mobile numbers (E.164, any country) ---------- */
const LP=window.libphonenumber||null;
const FALLBACK=[['IN','91'],['AE','971'],['US','1'],['GB','44'],['SG','65'],['AU','61'],['CA','1'],['SA','966'],['QA','974'],['KW','965'],['OM','968'],['BH','973'],['NP','977'],['BD','880'],['LK','94'],['MY','60'],['ZA','27'],['KE','254'],['NG','234'],['DE','49'],['FR','33'],['NL','31'],['NZ','64'],['IE','353'],['PH','63'],['ID','62']];
const DN=(()=>{try{return new Intl.DisplayNames(['en'],{type:'region'})}catch(e){return null}})();
const cname=c=>{try{return(DN&&DN.of(c))||c}catch(e){return c}};
const COUNTRIES=(LP&&LP.getCountries?LP.getCountries().map(c=>({c,d:LP.getCountryCallingCode(c)})):FALLBACK.map(([c,d])=>({c,d}))).map(o=>({...o,n:cname(o.c)})).sort((a,b)=>a.n.localeCompare(b.n));
const COMMON=['IN','AE','US','GB','SG','AU','CA','SA'];
const dialOf=c=>{const f=COUNTRIES.find(x=>x.c===c);return f?f.d:'91'};
function guessCountry(){try{const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';if(/Calcutta|Kolkata/.test(tz))return'IN';if(/Dubai/.test(tz))return'AE';if(/London/.test(tz))return'GB';if(/Singapore/.test(tz))return'SG';if(/^Australia\//.test(tz))return'AU';if(/^America\//.test(tz))return'US'}catch(e){}return'IN'}
function countryOpts(v){const o=x=>`<option value="${x.c}" ${x.c===v?'selected':''}>${esc(x.n)} (+${x.d})</option>`;return`<optgroup label="Common">${COMMON.map(c=>COUNTRIES.find(x=>x.c===c)).filter(Boolean).map(o).join('')}</optgroup><optgroup label="All countries">${COUNTRIES.map(x=>`<option value="${x.c}">${esc(x.n)} (+${x.d})</option>`).join('')}</optgroup>`}
const stripN=s=>String(s).replace(/[\s\-().\/]/g,'');
function normalize(raw,cc){const orig=String(raw??'').trim();if(!orig)return{ok:false,reason:'No number found'};
  let s=stripN(orig);if(/[a-z]/i.test(s))return{ok:false,reason:'Contains letters'};if(s.startsWith('00'))s='+'+s.slice(2);
  const plus=s.startsWith('+'),digits=s.replace(/\D/g,'');if(digits.length<6)return{ok:false,reason:'Too short'};if(digits.length>15)return{ok:false,reason:'Too long'};
  if(LP){const tries=plus?['+'+digits]:[digits,'+'+digits];for(const t of tries){let p=null;try{p=LP.parsePhoneNumberFromString(t,cc)}catch(e){}if(p&&p.isValid())return{ok:true,e164:p.number,changed:stripN(orig)!==p.number}}
    return{ok:false,reason:plus?'Not a valid number':'Not a valid '+cname(cc)+' number'}}
  let e;const dial=dialOf(cc);if(plus)e='+'+digits;else{const d=digits.replace(/^0+/,'');
    if(cc==='IN'){if(d.length===10)e='+91'+d;else if(d.length===12&&d.startsWith('91'))e='+'+d;else return{ok:false,reason:'Indian mobile numbers have 10 digits'}}
    else e=(d.startsWith(dial)&&d.length>=dial.length+7)?'+'+d:'+'+dial+d}
  if(e.startsWith('+91')&&!/^\+91[6-9]\d{9}$/.test(e))return{ok:false,reason:'Not a valid Indian mobile number'};
  if(e.length<8||e.length>16)return{ok:false,reason:'Wrong length'};return{ok:true,e164:e,changed:stripN(orig)!==e}}
function fmtNum(e){if(!e)return'';if(LP){try{const p=LP.parsePhoneNumberFromString(e);if(p)return p.formatInternational()}catch(x){}}
  const m=e.match(/^\+91(\d{5})(\d{5})$/);if(m)return`+91 ${m[1]} ${m[2]}`;
  const d=[...new Set(COUNTRIES.map(c=>c.d))].sort((a,b)=>b.length-a.length).find(x=>e.startsWith('+'+x));if(!d)return e;return'+'+d+' '+e.slice(d.length+1).replace(/(\d{3})(?=\d{3,})/g,'$1 ')}
function maskNum(e){const f=fmtNum(e),tot=(f.match(/\d/g)||[]).length;let k=0;return f.replace(/\d/g,d=>{k++;return(k>4&&k<=tot-3)?'•':d})}

/* ---------- tickets + patterns ---------- */
const PAT={early5:{name:'Early Five',desc:'Any 5 numbers on your ticket'},top:{name:'Top Line',desc:'All 5 numbers of the first row'},mid:{name:'Middle Line',desc:'All 5 numbers of the second row'},bot:{name:'Bottom Line',desc:'All 5 numbers of the third row'},corners:{name:'Four Corners',desc:'First and last numbers of the top and bottom rows'},star:{name:'Star',desc:'Four corners and the centre of the middle row'},full:{name:'Full House',desc:'All 15 numbers on your ticket'},full2:{name:'Second Full House',desc:'The next Full House after the first'}};
const SHAPES={early5:[1,5,12,20,25],top:[0,2,4,6,8],mid:[9,11,13,15,17],bot:[18,20,22,24,26],corners:[0,8,18,26],star:[0,8,18,26,13],full:[...Array(27).keys()],full2:[...Array(27).keys()]};
const colRange=c=>[c===0?1:c*10,c===8?90:c*10+9];
function genTicket(){while(true){const g=[0,1,2].map(()=>{const r=Array(9).fill(false);shuffle([...Array(9).keys()]).slice(0,5).forEach(c=>r[c]=true);return r});
  let ok=true;for(let c=0;c<9;c++)if(!(g[0][c]||g[1][c]||g[2][c]))ok=false;if(!ok)continue;const t=[[],[],[]];
  for(let c=0;c<9;c++){const[lo,hi]=colRange(c);const pool=[];for(let v=lo;v<=hi;v++)pool.push(v);const k=[0,1,2].filter(r=>g[r][c]).length;const p=shuffle(pool).slice(0,k).sort((a,b)=>a-b);let i=0;for(let r=0;r<3;r++)t[r][c]=g[r][c]?p[i++]:null}
  return t}}
function patternNums(t,k){const row=r=>t[r].filter(v=>v!==null);if(k==='top')return row(0);if(k==='mid')return row(1);if(k==='bot')return row(2);
  if(k==='corners'){const a=row(0),c=row(2);return[a[0],a[4],c[0],c[4]]}if(k==='star'){const a=row(0),b=row(1),c=row(2);return[a[0],a[4],c[0],c[4],b[2]]}
  if(k==='full'||k==='full2')return[...row(0),...row(1),...row(2)];return null}
function mini(k){const s=new Set(SHAPES[k]);let h='<span class="mini">';for(let i=0;i<27;i++)h+=`<i class="${s.has(i)?'p':''}"></i>`;return h+'</span>'}
function tid(g,p){const base=`TMB-${(g.org||'ORG').replace(/[^A-Za-z]/g,'').toUpperCase().slice(0,4)}-${g.id}-${String(p.serial).padStart(6,'0')}`;let h=0;for(const ch of base)h=(h*31+ch.charCodeAt(0))%23;return base+'-'+'ABCDEFGHJKLMNPQRSTUVWXY'[h]}

  kanglish:{label:'Kanglish',t:["Number {n}! {h}, sakkath!","Number {n} bantu. {h}!","Number {n}. {h}, bega cut maadi!"]},tenglish:{label:'Tenglish',t:["Number {n}! {h}, adhirindi!","Number {n} vachindi. {h}!","Number {n}. {h}, twaraga cut cheyyandi!"]},
  english:{label:'English (India)',t:["Number {n}. {h}."]},intl:{label:'International English',intl:true,t:["{h}, number {n}.","Number {n}. {h}."]}};
function line(n,lang){const L=LANGS[lang]||LANGS.intl;const h=(L.intl?HOOK_INTL:HOOK)[n];return L.t[n%L.t.length].replace('{n}',n).replace('{h}',h)}
const VPREF={hinglish:['hi-IN','en-IN'],tamlish:['en-IN','ta-IN'],kanglish:['en-IN','kn-IN'],tenglish:['en-IN','te-IN'],english:['en-IN'],intl:['en-GB','en-AU','en-US']};
function speak(text,lang){if(!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const vs=speechSynthesis.getVoices();const pref=VPREF[lang]||['en-GB'];let best=null,score=-1;
  vs.forEach(v=>{let s=0;const i=pref.indexOf(v.lang);if(i>=0)s+=10-i*2;if(/natural|neural|online/i.test(v.name))s+=3;if(s>score){score=s;best=v}});if(best&&score>0){u.voice=best;u.lang=best.lang}else u.lang=pref[0];speechSynthesis.speak(u)}catch(e){}}

/* ---------- pricing ---------- */
const PACKS=[[100,500,79],[250,1000,149],[500,1500,249],[750,1800,329],[1000,2000,399],[2500,4000,799],[5000,6250,1299],[10000,10000,1999]];
const GST=0.18,r2=x=>Math.round(x*100)/100;
const TZ=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){return''}})();
let CUR=(/^Asia\/(Kolkata|Calcutta)$/.test(TZ))?'INR':'USD';
const money=(n,c=CUR)=>c==='INR'?'₹'+n.toLocaleString('en-IN',{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2}):'US$'+n.toLocaleString('en-US',{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2});
const nf=n=>Number(n).toLocaleString(CUR==='INR'?'en-IN':'en-US');
function price(pack,c=CUR){const p=PACKS.find(x=>x[0]===pack);if(c==='INR'){const b=r2(p[1]/(1+GST));return{t:p[1],b,g:r2(p[1]-b)}}return{t:p[2],b:p[2],g:0}}

<script>
/* =====================================================================
   DB – stands in for the server + database. Every rule is enforced here,
   not in the screens, so the screens cannot bypass it (like the server would).
   ===================================================================== */
let DB;
const PRIZES_IN=[['early5','₹1,000 Amazon voucher'],['top','₹1,500 Amazon voucher'],['mid','₹1,500 Amazon voucher'],['bot','₹1,500 Amazon voucher'],['corners','₹2,000 Amazon voucher'],['full','₹5,000 voucher and trophy']];
function blankDB(){return{organizers:[],orders:[],games:[],devices:[],summaries:[],session:null}}
function G(id){return DB.games.find(g=>g.id===id)}
function P(g,pid){return g.participants.find(p=>p.id===pid)}
function D(id){return DB.devices.find(d=>d.id===id)}
function orgOf(g){return DB.organizers.find(o=>o.id===g.orgId)}
function logG(g,msg){g.log.unshift({t:now(),msg});if(g.log.length>200)g.log.pop()}
function newGame(o){const g=Object.assign({id:code(4),code:code(7),name:'My Tambola',org:'My organization',orgId:null,orderId:null,startsAt:now()+36e5,tz:TZ||'Asia/Kolkata',country:'IN',limit:100,
  family:2,familyCanWin:true,pinv:0,callMode:'ai',lang:'hinglish',prizes:PRIZES_IN.map(([k,prize])=>({k,prize,share:'equal'})),breaks:[],
  status:'open',participants:[],waiting:[],conflicts:[],log:[],called:[],draw:shuffle([...Array(90)].map((_,i)=>i+1)),current:null,nextAt:null,paused:null,won:{},bogeys:[],claims:[],
  startedAt:null,endedAt:null,talking:false,lastDrawAt:0,serial:100,removed:null},o);g.won={};logG(g,'Game created');return g}
const placesUsed=g=>g.participants.length;
const placesLeft=g=>g.limit-placesUsed(g);
const joinedN=g=>g.participants.filter(p=>p.status==='joined').length;
function numberInGame(g,e){return g.participants.find(p=>p.e164===e)||g.waiting.find(w=>w.e164===e)}
function mkP(g,o){g.serial+=Math.floor(1+Math.random()*9);return Object.assign({id:uid('p'),name:'',e164:'',role:'player',kind:null,source:'list',invitedBy:null,status:'not_joined',cap:25,pass:null,roleLink:null,device:null,consentAt:null,joinedAt:null,ticket:genTicket(),cut:new Set(),bogeys:0,blocked:false,serial:g.serial,createdAt:now(),info:''},o)}
const entryOpen=g=>g.status==='open';
function guardEntry(g,n=1){if(!entryOpen(g))return'Entry is closed. The game has started.';if(placesLeft(g)<n)return`The game is full (${g.limit} places). Raise the player limit to add more.`;return null}

/* ----- upload (check step, then commit) ----- */
function splitLine(line){const cells=line.split(/[,\t;|]/).map(x=>x.trim()).filter(Boolean);let best=-1,bd=0;cells.forEach((c,i)=>{const n=(c.match(/\d/g)||[]).length;if(n>bd){bd=n;best=i}});
  if(best<0)return{num:'',name:cells.join(' ')};return{num:cells[best],name:cells.filter((c,i)=>i!==best&&!/\d{4,}/.test(c)).join(' ')}}
function runCheck(g,text){const lines=String(text).split(/\r?\n/).map(l=>l.trim()).filter(Boolean);const out={ready:[],fixed:[],repeats:[],bad:[]};const seen=new Set();
  lines.forEach((ln,i)=>{if(i===0&&!/\d/.test(ln))return;const{num,name}=splitLine(ln);if(!num){out.bad.push({ln,reason:'No number found'});return}
    const r=normalize(num,g.country);if(!r.ok){out.bad.push({ln,reason:r.reason});return}
    if(seen.has(r.e164)){out.repeats.push({ln,reason:'Repeated in your list'});return}
    if(numberInGame(g,r.e164)){out.repeats.push({ln,reason:'Already in this game'});return}
    seen.add(r.e164);const item={ln,name:name||'',e164:r.e164};(r.changed?out.fixed:out.ready).push(item)});return out}
function commitUpload(g,items){const e=guardEntry(g,items.length);if(e)return{ok:false,reason:e.includes('full')?`This adds ${items.length} people, but only ${placesLeft(g)} places are left under your limit of ${g.limit}. Raise the player limit in step 1, or remove some names.`:e};
  items.forEach(it=>g.participants.push(mkP(g,{name:it.name||'',e164:it.e164,source:'list'})));logG(g,`Organizer added ${plural(items.length,'person','people')} to the list`);return{ok:true}}

/* ----- roles ----- */
function setRole(g,actor,p,role,cap){if(!entryOpen(g))return'Settings are locked after the start.';if(p.kind==='family')return'Family members cannot be made Host or Team Lead.';
  if(actor.role==='host'&&(role==='host'||p.role==='host'))return'Only the Organizer can make or change Hosts.';
  p.role=role;if(role==='team_lead')p.cap=cap||p.cap||25;if(role!=='player'&&!p.roleLink)p.roleLink={code:code(8)};logG(g,`${actor.role==='org'?'Organizer':'Host'} made ${p.name||fmtNum(p.e164)} ${role==='team_lead'?'Team Lead ('+p.cap+')':role==='host'?'Host':'a regular player'}`);return null}
function descendants(g,p){const out=[];const walk=x=>g.participants.filter(c=>c.invitedBy===x.id).forEach(c=>{out.push(c);walk(c)});walk(p);return out}
function removeP(g,actor,ids){if(!entryOpen(g))return'Nobody can be removed after the start.';const set=new Set();ids.forEach(id=>{const p=P(g,id);if(!p)return;if(actor.role==='host'&&p.role==='host')return;set.add(p);descendants(g,p).forEach(c=>set.add(c))});
  const removed=[...set];g.participants=g.participants.filter(p=>!set.has(p));removed.forEach(p=>{if(p.device){const d=D(p.device);if(d&&d.bind&&d.bind.pid===p.id)d.bind=null}});logG(g,`Removed ${plural(removed.length,'person','people')}`);return{removed}}

/* ----- passes (Team Lead colleagues, family, Organizer/Host role links) ----- */
function colleagueUsed(g,p){return g.participants.filter(x=>x.invitedBy===p.id&&x.kind==='colleague').length}
function familyUsed(g,p){return g.participants.filter(x=>x.invitedBy===p.id&&x.kind==='family').length}
function playerInvitesUsed(g,p){return g.waiting.filter(w=>w.invitedBy===p.id).length+g.participants.filter(x=>x.invitedBy===p.id&&x.kind==='colleague'&&x.source==='waiting_room').length}
function createPass(g,sender,{name,e164,kind}){let e=guardEntry(g);if(e)return{ok:false,reason:e};
  if(!name||name.trim().length<2)return{ok:false,reason:'Enter their name.'};
  if(numberInGame(g,e164))return{ok:false,reason:'This number is already in this game.'};
  if(sender.kind==='family')return{ok:false,reason:'Family members cannot invite anyone.'};
  if(kind==='colleague'){if(sender.role!=='team_lead')return{ok:false,reason:'Only Team Leads can send colleague passes.'};if(colleagueUsed(g,sender)>=sender.cap)return{ok:false,reason:`You have used all ${sender.cap} colleague passes. Ask the organizer for more.`}}
  if(kind==='family'){if(g.family===0)return{ok:false,reason:'This game does not allow family members.'};if(familyUsed(g,sender)>=g.family)return{ok:false,reason:`You have used all ${g.family} family passes.`}}
  const p=mkP(g,{name:name.trim(),e164,kind,source:'pass',invitedBy:sender.id,status:'pass_sent',pass:{code:code(8)}});g.participants.push(p);logG(g,`${sender.name} created a ${kind} pass for ${p.name}`);return{ok:true,p}}
function passLink(p){return`https://${CFG.DOMAIN}/p/${p.pass?p.pass.code:(p.roleLink?p.roleLink.code:'')}`}
function gameLink(g){return`https://${CFG.DOMAIN}/g/${g.code}`}
function cancelPass(g,p){if(p.status==='joined')return'This pass has been used. It cannot be cancelled.';if(!entryOpen(g))return'Entry is closed.';g.participants=g.participants.filter(x=>x!==p);p.pass.cancelled=true;DB._cancelled=(DB._cancelled||[]);DB._cancelled.push(p.pass.code);logG(g,`Pass for ${p.name} cancelled`);return null}
function reissuePass(g,p){if(!entryOpen(g))return'Entry is closed.';DB._cancelled=(DB._cancelled||[]);if(p.pass)DB._cancelled.push(p.pass.code);p.pass={code:code(8)};if(p.device){const d=D(p.device);if(d)d.bind=null;p.device=null}if(p.status==='joined')p.status='pass_sent';logG(g,`New pass issued for ${p.name}. The old one stopped working.`);return null}

/* ----- joining ----- */
function bind(g,p,dev){p.device=dev.id;p.status='joined';p.joinedAt=now();p.consentAt=now();dev.bind={gid:g.id,pid:p.id};if(!dev.games.includes(g.id))dev.games.push(g.id)}
function raiseConflict(g,p,dev){if(!g.conflicts.find(c=>c.pid===p.id&&c.dev===dev.id&&!c.done)){g.conflicts.push({id:uid('c'),pid:p.id,dev:dev.id,at:now(),done:false});logG(g,`Second phone tried to join as ${p.name||fmtNum(p.e164)}`)}}
function resolveConflict(g,c,res){c.done=true;c.res=res;const p=P(g,c.pid);if(!p)return;if(res==='moved'){const old=D(p.device);if(old){old.bind=null;old.kicked={gid:g.id,at:now()}}const nd=D(c.dev);if(nd){p.device=nd.id;nd.bind={gid:g.id,pid:p.id};nd.blocked=null;if(!nd.games.includes(g.id))nd.games.push(g.id)}logG(g,`${p.name}'s entry moved to the new phone`)}else logG(g,`Kept ${p.name}'s first phone`)}
function joinByNumber(g,dev,e164){dev.tries=(dev.tries||[]).filter(t=>now()-t<6e5);if(dev.tries.length>=5)return{t:'err',k:'rate'};dev.tries.push(now());
  const p=g.participants.find(x=>x.e164===e164);
  if(p&&p.status==='joined'){if(p.device===dev.id)return{t:'game',p};raiseConflict(g,p,dev);return{t:'err',k:'inuse'}}
  if(!entryOpen(g))return{t:'err',k:'closed'};
  if(p){if(p.source==='pass'&&p.status==='pass_sent')return{t:'err',k:'usepass',p};return{t:'consent',p}}
  const w=g.waiting.find(x=>x.e164===e164);if(w)return{t:'wait',w};
  if(placesLeft(g)<1)return{t:'err',k:'full'};return{t:'ask'}}
function openPass(dev,passCode){for(const g of DB.games){const p=g.participants.find(x=>x.pass&&x.pass.code===passCode);if(p){
    if(p.status==='joined'){if(p.device===dev.id)return{t:'game',g,p};raiseConflict(g,p,dev);return{t:'err',k:'inuse',g}}
    if(!entryOpen(g))return{t:'err',k:'closed',g};return{t:'pass',g,p}}}
  if((DB._cancelled||[]).includes(passCode))return{t:'err',k:'cancelled'};return{t:'err',k:'badlink'}}
function askToJoin(g,dev,{name,info,e164,invitedBy}){const e=guardEntry(g);if(e)return e;if(numberInGame(g,e164))return'This number is already in this game.';
  const w={id:uid('w'),name,info:info||'',e164,source:invitedBy?'player_invite':'common_link',invitedBy:invitedBy||null,at:now(),dev:dev?dev.id:null};g.waiting.push(w);logG(g,`${name} is in the waiting room`);return null}
function admit(g,ids){const list=g.waiting.filter(w=>ids.includes(w.id));if(!entryOpen(g))return'Entry is closed.';if(placesLeft(g)<list.length)return`Only ${placesLeft(g)} places are left under your limit of ${g.limit}. Raise the limit or admit fewer people.`;
  list.forEach(w=>{const p=mkP(g,{name:w.name,e164:w.e164,source:'waiting_room',invitedBy:w.invitedBy,kind:w.invitedBy?'colleague':null,info:w.info});g.participants.push(p);const d=w.dev&&D(w.dev);if(d)bind(g,p,d)});
  g.waiting=g.waiting.filter(w=>!ids.includes(w.id));logG(g,`Admitted ${plural(list.length,'person','people')} from the waiting room`);return null}
function decline(g,ids){const list=g.waiting.filter(w=>ids.includes(w.id));g.waiting=g.waiting.filter(w=>!ids.includes(w.id));list.forEach(w=>{const d=w.dev&&D(w.dev);if(d)d.declined=g.id});logG(g,`Declined ${plural(list.length,'request')}`);return list}

/* ----- lifecycle ----- */
function startGame(g){if(g.status!=='open')return;g.status='started';g.startedAt=now();g.nextAt=now()+(g.callMode==='manual'?0:4000);g.waiting.forEach(w=>{const d=w.dev&&D(w.dev);if(d)d.closedOut=g.id});logG(g,'Game started. Entry closed.');g.lastDrawAt=0}
function endGame(g,why){if(g.status!=='started')return;g.status='ended';g.endedAt=now();g.paused=null;g.talking=false;logG(g,'Game ended'+(why?': '+why:''))}
function purge(g){if(g.status!=='ended')return;DB.summaries.push({gameId:g.id,orgId:g.orgId,players:g.participants.length,family:g.participants.filter(p=>p.kind==='family').length,teamLeads:g.participants.filter(p=>p.role==='team_lead').length,startedAt:g.startedAt,endedAt:g.endedAt});
  g.participants=[];g.waiting=[];g.conflicts=[];g.log=[];g.claims=[];g.bogeys=[];g.status='purged';DB.devices.forEach(d=>{if(d.bind&&d.bind.gid===g.id)d.bind=null;d.games=d.games.filter(x=>x!==g.id)})}

/* =====================================================================
   LIVE GAME ENGINE
   ===================================================================== */
const openPrizes=g=>g.prizes.filter(z=>!g.won[z.k]);
const isBot=p=>{const d=p.device&&D(p.device);return p.status==='joined'&&(!d||!d.real)};
function nextBreak(g){return g.breaks.find(b=>!b.done&&b.after===g.called.length)}
function draw(g,by){if(g.status!=='started'||g.paused)return;if(g.called.length>=90){endGame(g,'all 90 numbers called');return}
  const br=nextBreak(g);if(br){br.done=true;g.paused={type:'break',br,until:now()+br.dur*1000,t0:now()};logG(g,`Brand break: ${br.title} (${br.dur} sec)`);return}
  const n=g.draw[g.called.length];g.called.push(n);g.current=n;g.lastDrawAt=now();g.nextAt=now()+CFG.AI_GAP*SPEED;logG(g,`Call ${g.called.length}: ${n}${by?' (drawn by '+by+')':''}`);
  g.participants.forEach(p=>{if(isBot(p)&&p.ticket.flat().includes(n)&&Math.random()<.93)p.cut.add(n)});
  onDraw(g,n);botClaims(g)}
function completionIdx(g,p,k){const idx=v=>g.called.indexOf(v);if(k==='early5'){const c=[...p.cut].filter(v=>g.called.includes(v)).map(idx).sort((a,b)=>a-b);return c.length>=5?c[4]:-1}
  const nums=patternNums(p.ticket,k);if(!nums.every(v=>g.called.includes(v)&&p.cut.has(v)))return-1;return Math.max(...nums.map(idx))}
function botClaims(g){const L=g.called.length-1;g.participants.filter(isBot).forEach(p=>{if(p.blocked)return;openPrizes(g).forEach(z=>{if(z.k==='full2'&&!g.won.full)return;
    if(completionIdx(g,p,z.k)===L&&Math.random()<.8)setTimeout(()=>{if(g.called.length-1===L&&g.status==='started')claim(g,p,z.k)},500+rnd(1200))})});
  if(Math.random()<.015&&g.called.length>8){const p=g.participants.filter(x=>isBot(x)&&!x.blocked)[0];const z=openPrizes(g)[0];if(p&&z)setTimeout(()=>{if(g.status==='started')claim(g,p,z.k)},900)}}
function claim(g,p,k){if(g.status!=='started')return'The game is not running.';if(p.blocked)return'Your ticket is blocked after 2 wrong claims.';
  if(g.paused&&g.paused.type!=='claim')return'Please wait – the game is paused.';if(g.won[k]&&g.won[k][0].idx<g.called.length-1)return'This prize has already been won.';
  const c={id:uid('cl'),pid:p.id,k,idx:g.called.length-1,at:now()};g.claims.push(c);
  if(!g.paused)g.paused={type:'claim',items:[c],checkAt:now()+CFG.CLAIM_CHECK,t0:now()};else g.paused.items.push(c);logG(g,`${p.name} claimed ${PAT[k].name} – game paused for everyone`);return null}
function checkClaims(g){const items=g.paused.items;const results=[];
  items.forEach(c=>{const p=P(g,c.pid);if(!p)return;const z=g.prizes.find(x=>x.k===c.k);let ok=false,why='';
    if(!z){why='This prize is not in this game.'}
    else if(c.k==='full2'&&!(g.won.full&&g.won.full[0].idx<c.idx)){why='Second Full House can only be won after the first.'}
    else if(g.won[c.k]&&g.won[c.k][0].idx<c.idx){why='This prize was already won.'}
    else{const ci=completionIdx(g,p,c.k);if(ci===-1){const nums=c.k==='early5'?null:patternNums(p.ticket,c.k);why=nums&&nums.some(v=>!g.called.includes(v))?'Some numbers of this pattern have not been called.':'Some numbers of this pattern were not cut.'}
      else if(ci<c.idx)why='Late claim: the pattern was complete before the last number. Claims must come before the next number.';else ok=true}
    if(ok){const fun=p.kind==='family'&&!g.familyCanWin;if(!fun){g.won[c.k]=g.won[c.k]||[];if(!g.won[c.k].find(w=>w.pid===p.id))g.won[c.k].push({pid:p.id,name:p.name,idx:c.idx,callNo:g.called.length,num:g.current,at:now()})}
      results.push({ok:true,fun,p,k:c.k});logG(g,fun?`${p.name}: valid ${PAT[c.k].name} (family plays for fun, no prize)`:`Prize awarded: ${PAT[c.k].name} to ${p.name}`)}
    else{p.bogeys++;if(p.bogeys>=2)p.blocked=true;g.bogeys.push({pid:p.id,name:p.name,k:c.k,at:now(),why});results.push({ok:false,p,k:c.k,why});logG(g,`Bogey: ${p.name} – ${PAT[c.k].name}. ${why}`)}});
  Object.values(g.won).forEach(ws=>ws.forEach(w=>w.share=ws.length));
  g.paused={type:'result',results,until:now()+CFG.RESULT_SHOW,t0:now()};onResult(g,results)}
let SPEED=1;
function tick(){const t=now();DB.games.forEach(g=>{if(g.status!=='started')return;const pz=g.paused;
  if(pz){if(pz.type==='claim'&&t>=pz.checkAt)checkClaims(g);else if((pz.type==='result'||pz.type==='break')&&t>=pz.until){g.paused=null;g.nextAt=t+(g.callMode==='manual'?0:3000*SPEED);if(!openPrizes(g).length){endGame(g,'all prizes won')}}}
  else if(g.callMode!=='manual'&&g.nextAt&&t>=g.nextAt)draw(g)});liveUpdate()}
function emergency(g,reason){if(g.status!=='started'||g.paused)return;g.paused={type:'emergency',reason,t0:now()};logG(g,'Emergency pause: '+reason)}
function resume(g){if(g.paused&&g.paused.type==='emergency'){g.paused=null;g.nextAt=now()+4000;logG(g,'Game resumed')}}
function endBreak(g){if(g.paused&&g.paused.type==='break'){g.paused.until=now();logG(g,'Brand break ended early by the host')}}
function hostDraw(g,who){if(g.callMode==='ai')return'In AI voice mode the system calls the numbers.';if(g.paused)return'The game is paused.';if(now()-g.lastDrawAt<CFG.MIN_HOST_GAP)return`Wait ${Math.ceil((CFG.MIN_HOST_GAP-(now()-g.lastDrawAt))/1000)} more seconds between numbers.`;draw(g,who);return null}

/* fast-forward for demo scenarios: draws numbers and awards bot claims instantly */
function fastForward(g,n){for(let i=0;i<n&&g.status==='started';i++){if(g.called.length>=90){endGame(g,'all 90 numbers called');break}const br=nextBreak(g);if(br)br.done=true;const num=g.draw[g.called.length];g.called.push(num);g.current=num;
    g.participants.forEach(p=>{if(p.status==='joined'&&p.ticket.flat().includes(num)&&(isBot(p)?Math.random()<.93:Math.random()<.8))p.cut.add(num)});
    const L=g.called.length-1;openPrizes(g).forEach(z=>{if(z.k==='full2'&&!g.won.full)return;const ws=g.participants.filter(p=>isBot(p)&&completionIdx(g,p,z.k)===L&&!(p.kind==='family'&&!g.familyCanWin));
      if(ws.length){g.won[z.k]=ws.slice(0,2).map(p=>({pid:p.id,name:p.name,idx:L,callNo:L+1,num,at:now()-(n-i)*11000,share:Math.min(2,ws.length)}));logG(g,`Prize awarded: ${PAT[z.k].name} to ${ws.slice(0,2).map(p=>p.name).join(' and ')}`)}});
    if(!openPrizes(g).length)endGame(g,'all prizes won')}g.lastDrawAt=now();g.nextAt=now()+CFG.AI_GAP*SPEED}

/* =====================================================================
   SCENARIOS (reset the fake database to a known state)
   ===================================================================== */
const SAMPLE=[['Anita Rao','+919820011223'],['Priya Nair','+919812345670'],['Rahul Mehta','+919876543210'],['Sana Sheikh','+919900112233'],['Vikram Singh','+918888777666'],['Deepa Iyer','+919845098450'],
  ['Fatima Khan','+919987611223'],['Emily Chen','+6591234567'],['Ahmed Ali','+971507654321'],['Arjun Kapoor','+919820044556'],['Suresh Kumar','+919123456780'],['Lakshmi Menon','+919988776655'],['Joseph DSouza','+919812312312'],
  ['Kavya Reddy','+919700011122'],['Nikhil Joshi','+919811100022'],['Pooja Bhatt','+919822233344'],['Sam Wilson','+447700900456'],['Omar Farooq','+971501119988']];
function mkDevice(label,real=true){const d={id:uid('d'),label,real,bind:null,games:[],tries:[],scr:'home',ctx:{},voice:true,audio:false};DB.devices.push(d);return d}
function seed(kind){DB=blankDB();_id=1;const o={id:'o1',name:'Neha Kapoor',email:'neha@acme.com',org:'Acme Industries',country:'IN'};DB.organizers.push(o);
  if(kind==='fresh'){const ord={id:'ord1',orgId:'o1',pack:250,currency:'INR',total:1000,status:'paid',at:now()};DB.orders.push(ord);
    const g=newGame({name:'My first Tambola',org:'Acme Industries',orgId:'o1',orderId:'ord1',limit:250,startsAt:now()+2*864e5});DB.games.push(g);DB.session={orgId:'o1'};return g}
  const g=newGame({id:'DW26',code:'T3DF43K',name:'Diwali Tambola 2026',org:'Acme Industries',orgId:'o1',limit:1000,pinv:1,startsAt:now()+30*6e4,callMode:'both',
    breaks:[{id:uid('b'),after:15,type:'video',title:"Acme's new launch video",dur:30,done:false,file:null},{id:uid('b'),after:40,type:'speech',title:"MD's Diwali message",dur:45,done:false}]});DB.games.push(g);
  DB.orders.push({id:'ord1',orgId:'o1',pack:1000,currency:'INR',total:2000,status:'paid',at:now()-864e5});g.orderId='ord1';
  SAMPLE.forEach(([name,e])=>g.participants.push(mkP(g,{name,e164:e,source:'list'})));
  const by=n=>g.participants.find(p=>p.name===n);
  setRole(g,{role:'org'},by('Anita Rao'),'host');setRole(g,{role:'org'},by('Priya Nair'),'team_lead',25);setRole(g,{role:'org'},by('Vikram Singh'),'team_lead',10);
  const bot=[];['Anita Rao','Priya Nair','Deepa Iyer','Sana Sheikh','Fatima Khan','Emily Chen','Arjun Kapoor','Kavya Reddy','Nikhil Joshi','Pooja Bhatt','Sam Wilson','Omar Farooq','Lakshmi Menon'].forEach(n=>{const p=by(n);p.status='joined';p.joinedAt=now()-rnd(3e5);p.consentAt=p.joinedAt;p.device='bot'});
  const pr=by('Priya Nair');const k=createPass(g,pr,{name:'Karan Shah',e164:'+919811122233',kind:'colleague'}).p;k.status='joined';k.device='bot';
  createPass(g,pr,{name:'Tom Baker',e164:'+447700900123',kind:'colleague'});createPass(g,pr,{name:'Meera Nair',e164:'+919812345671',kind:'family'});
  const rahul=by('Rahul Mehta');const rd=mkDevice("Rahul's phone");bind(g,rahul,rd);
  const pd=mkDevice("Priya's phone");pr.device=pd.id;pd.bind={gid:g.id,pid:pr.id};pd.games.push(g.id);
  g.waiting.push({id:uid('w'),name:'Imran Qureshi',info:'Finance',e164:'+919833344455',source:'common_link',invitedBy:null,at:now()-36e4,dev:null});
  g.waiting.push({id:uid('w'),name:'Neha Gupta',info:'',e164:'+919822200011',source:'player_invite',invitedBy:rahul.id,at:now()-18e4,dev:null});
  const wd=mkDevice("Rohit's phone");g.waiting.push({id:uid('w'),name:'Rohit Das',info:'Dubai sales',e164:'+971501234567',source:'common_link',invitedBy:null,at:now()-6e4,dev:wd.id});wd.scr='wait';wd.ctx={gid:g.id,e164:'+971501234567'};wd.games.push(g.id);
  const sd=mkDevice('Second phone (Rahul?)');g.conflicts.push({id:uid('c'),pid:rahul.id,dev:sd.id,at:now()-12e4,done:false});sd.scr='err';sd.ctx={gid:g.id,k:'inuse'};
  // second game for the same organizer: Gulf, international English, US$
  const g2=newGame({id:'GLF1',code:'GLF7Q2P',name:'Gulf Team Night Housie',org:'Acme Middle East',orgId:'o1',limit:250,country:'AE',lang:'intl',callMode:'ai',startsAt:now()+5*864e5,
    prizes:[['early5','AED 150 voucher'],['top','AED 250 voucher'],['mid','AED 250 voucher'],['bot','AED 250 voucher'],['full','AED 1,000 voucher']].map(([k,prize])=>({k,prize,share:'equal'}))});
  [['Omar Siddiqui','+971501112233'],['Layla Hassan','+971552223344'],['Ravi Menon','+971503334455'],['John Carter','+447700900777']].forEach(([n,e])=>g2.participants.push(mkP(g2,{name:n,e164:e})));DB.games.push(g2);
  DB.orders.push({id:'ord2',orgId:'o1',pack:250,currency:'USD',total:149,status:'paid',at:now()-2*864e5});g2.orderId='ord2';
  DB.session={orgId:'o1'};
  if(kind==='live'||kind==='ended'){admit(g,g.waiting.map(w=>w.id));g.conflicts.forEach(c=>resolveConflict(g,c,'kept'));startGame(g);g.startedAt=now()-6*6e4;fastForward(g,kind==='ended'?95:22);if(kind==='ended'&&g.status==='started')endGame(g,'Organizer ended the game');if(kind==='live'){g.nextAt=now()+6000}}
  return g}

  <div class="sin" style="display:flex;align-items:center"><div class="smain" style="width:100%">
   <section><div class="eyebrow">One game. Everyone together.</div>
    <h1>Engage your company's <em>extended family.</em></h1>
    <ul class="acts"><li><span class="b">${ic('rocket')}</span>Launch your product.</li><li><span class="b">${ic('play')}</span>Show your video.</li><li><span class="b">${ic('mic')}</span>Give your speech.</li></ul>

    <div class="buy"><div class="buytop"><span>Price per game · no yearly plan</span><span class="cur">${['INR','USD'].map(k=>`<button class="${CUR===k?'on':''}" onclick="CUR='${k}';render()">${k==='INR'?'₹ INR':'US$'}</button>`).join('')}</span></div>
     <div class="buyrow"><div class="selwrap"><select id="pack" aria-label="Engagements per game" onchange="packIdx=+this.value;render()">${PACKS.map(([n],i)=>`<option value="${i}" ${i===packIdx?'selected':''}>Up to ${nf(n)} engagements</option>`).join('')}</select><svg class="ic chev"><use href="#i-chev"/></svg></div>
      <button class="btn" id="payBtn" onclick="checkout()">Create your Tambola ${ic('arrow')}</button></div>
     <div class="brk">${CUR==='INR'?`<span>Software <b>${money(c.b)}</b></span><span>GST 18% <b>${money(c.g)}</b></span><span>Total <b>${money(c.t)}</b></span>`:`<span>Total <b>${money(c.t)}</b></span><span>No tax added · billed in US dollars</span>`}</div>
     <div class="def">1 engagement = 1 ticket per mobile number per game</div></div>
   </section>
   <section class="who"><div class="eyebrow">Engage…</div><ul id="whoL"><li>Employees</li><li>Their families</li><li>Dealers</li><li>Customers</li><li>Vendors</li><li>Ex-employees</li><li>Everyone you value</li></ul>
    <div class="eq"><p><b>Everyone engaged</b><span>= your brand remembered.</span></p><p><b>Families engaged</b><span>= your team together.</span></p></div></section>
   <section class="svis"><div class="tkt"><img src="${TICKET_IMG}" alt="The Tambola ticket players see on their phone">
    <div class="call c2"><span class="d">${ic('play')}</span><span><b>Brand break · 60 sec</b><span class="play" id="bbp">Acme's new launch video</span></span></div>
    <div class="call c1"><span class="d">${ic('users')}</span><span><b id="cnt">2,184 playing</b>from 9 countries, with families</span></div></div></section>

let whoI=0,bbp=0,cntN=2184;

const BUY_COUNTRIES=[['IN','India'],['AE','United Arab Emirates'],['SA','Saudi Arabia'],['QA','Qatar'],['OM','Oman'],['KW','Kuwait'],['BH','Bahrain'],['SG','Singapore'],['MY','Malaysia'],['GB','United Kingdom'],['US','United States'],['CA','Canada'],['AU','Australia'],['NZ','New Zealand'],['ZA','South Africa'],['KE','Kenya'],['NP','Nepal'],['LK','Sri Lanka'],['BD','Bangladesh'],['XX','Other country']];

  :`<div class="kv"><span>Software</span><b>${money(x.b,c)}</b></div><div class="kv"><span>Tax</span><b>None added</b></div><div class="kv t"><span>Total</span><b>${money(x.t,c)}</b></div>`}
function checkout(upgradeFor){const pack=PACKS[packIdx][0];ORDER={pack,upgradeFor:null};
  const def=CUR==='INR'?'IN':(/Dubai/.test(TZ)?'AE':/London/.test(TZ)?'GB':/^America\//.test(TZ)?'US':/^Australia\//.test(TZ)?'AU':/Singapore/.test(TZ)?'SG':'XX');

  <p class="tiny muted center">Unused engagements are not refunded. Prototype: use any work email, e.g. hr@newco.com (or neha@acme.com to add to the demo account).</p>`);taxField()}
function taxField(){const c=$('oCty').value;$('taxBox').innerHTML=c==='IN'?`<label class="lb" for="oGst">GSTIN (optional, for GST invoice)</label><input class="inp" id="oGst" maxlength="15" placeholder="e.g. 27ABCDE1234F1Z5" style="text-transform:uppercase">`
  :`<label class="lb" for="oGst">Company tax / VAT number (optional)</label><input class="inp" id="oGst" maxlength="30" placeholder="Shown on your invoice">`;
  const want=c==='IN'?'INR':'USD';if(want!==CUR){CUR=want}$('ordSum').innerHTML=sumHTML(ORDER.pack)}
function toPay(){const n=$('oName').value.trim(),m=$('oMail').value.trim().toLowerCase(),c=$('oCty').value,g=$('oGst').value.trim().toUpperCase();const err=t=>{$('oErr').innerHTML=`<div class="err">${ic('alert')}<span>${t}</span></div>`};
  if(n.length<2)return err('Please enter your organization name.');if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m))return err('Please enter a valid work email.');
  if(/@(gmail|yahoo|hotmail|outlook|live|icloud|rediffmail|proton)\./i.test(m))return err('Please use your work email, not a personal one. It is how we confirm your organization.');
  if(c==='IN'&&g&&!/^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(g))return err('This GSTIN does not look right. Leave it empty if you do not need a GST invoice.');
  Object.assign(ORDER,{org:n,mail:m,cty:c,gst:g,cur:CUR,total:price(ORDER.pack).t});
  const methods=CUR==='INR'?[['phone','UPI','Any UPI app'],['card','Card','Debit or credit card'],['bank','Net banking','All major Indian banks']]:[['card','Card','Visa, Mastercard, Amex'],['phone','Apple Pay / Google Pay','On supported devices'],['bank','Bank transfer','Invoice first, pay within 7 days']];
  sheet(`<div class="eyebrow">Step 2 of 2 · Payment</div><h2>Pay ${money(ORDER.total)}</h2><div class="sum"><div class="kv"><span>${esc(n)}</span><b>${nf(ORDER.pack)} engagements</b></div><div class="kv t"><span>Amount</span><b>${money(ORDER.total)}</b></div></div>
  <div class="pm" id="pm">${methods.map(([i,t,s],k)=>`<button class="${k?'':'on'}" onclick="document.querySelectorAll('#pm button').forEach(x=>x.classList.toggle('on',x===this))">${ic(i)}<span>${t}<small>${s}</small></span></button>`).join('')}</div>
  <button class="btn block" style="margin-top:14px" onclick="paid()">${ic('lock')} Pay ${money(ORDER.total)}</button><p class="proto">Prototype: this screen stands in for the payment gateway. No money is taken.</p>`)}
function paid(){let o=DB.organizers.find(x=>x.email===ORDER.mail);if(!o){o={id:uid('o'),name:ORDER.mail.split('@')[0],email:ORDER.mail,org:ORDER.org,country:ORDER.cty};DB.organizers.push(o)}
  const ord={id:uid('ord'),orgId:o.id,pack:ORDER.pack,currency:ORDER.cur,total:ORDER.total,tax:price(ORDER.pack,ORDER.cur).g,country:ORDER.cty,taxId:ORDER.gst,status:'paid',at:now()};DB.orders.push(ord);
  const g=newGame({name:'My Tambola',org:ORDER.org,orgId:o.id,orderId:ord.id,limit:ORDER.pack,country:ORDER.cty==='XX'?'IN':ORDER.cty,lang:ORDER.cty==='IN'?'hinglish':'intl',startsAt:now()+2*864e5,
    prizes:(ORDER.cty==='IN'?PRIZES_IN:[['early5','Voucher worth 25'],['top','Voucher worth 50'],['mid','Voucher worth 50'],['bot','Voucher worth 50'],['full','Voucher worth 200']]).map(([k,prize])=>({k,prize,share:'equal'}))});DB.games.push(g);DB.session={orgId:o.id};
  sheet(`<div class="res ok">${ic('check')}</div><h2 class="center">Payment received</h2><div class="sum"><div class="kv"><span>Order</span><b class="mono">${ord.id.toUpperCase()}</b></div><div class="kv"><span>Organization</span><b>${esc(o.org)}</b></div><div class="kv"><span>Engagements</span><b>${nf(ord.pack)}</b></div><div class="kv t"><span>Paid</span><b>${money(ord.total,ord.currency)}</b></div></div>
  <p class="small muted center">${ORDER.cty==='IN'&&ORDER.gst?'GST invoice for '+esc(ORDER.gst)+' sent to ':'Invoice sent to '}${esc(o.email)}. Your Organizer console link is in the same email.</p>
  <button class="btn block" onclick="closeSheet();go({mode:'console',role:'org',gid:'${g.id}'})">Open your Organizer console ${ic('arrow')}</button>`)}
/* upgrade an existing game's pack (pay the difference) */
function upgrade(g){const cur=g.limit;const ord=DB.orders.find(o=>o.id===g.orderId);const c=ord?ord.currency:CUR;const bigger=PACKS.filter(p=>p[0]>cur);
  if(!bigger.length)return sheet(`<h2>You have the biggest pack</h2><p class="muted">For more than 10,000 people, talk to us.</p><button class="btn block" onclick="closeSheet()">OK</button>`);
  const paidT=price(cur,c).t;sheet(`<div class="eyebrow">Move up to a bigger pack</div><h2>Raise the player limit</h2><p class="muted small">You pay only the difference. Available until the game starts.</p>
   <div class="pm">${bigger.map(([n])=>{const d=r2(price(n,c).t-paidT);return`<button onclick="doUpgrade('${g.id}',${n},${d},'${c}')"><span>${ic('users')}</span><span>Up to ${n.toLocaleString()} engagements<small>Pay ${money(d,c)} more</small></span></button>`}).join('')}</div>
   <button class="btn line block" style="margin-top:10px" onclick="closeSheet()">Cancel</button>`)}
function doUpgrade(gid,n,d,c){const g=G(gid);if(!entryOpen(g))return toast('Entry is closed. The pack cannot change after the start.');g.limit=n;DB.orders.push({id:uid('ord'),orgId:g.orgId,pack:n,currency:c,total:d,status:'paid',at:now(),upgradeOf:g.orderId});logG(g,`Player limit raised to ${n} (paid ${money(d,c)})`);closeSheet();toast(`Player limit is now ${n.toLocaleString()}`);render()}

  <label class="lb" for="lMail">Work email</label><input class="inp" id="lMail" type="email" placeholder="you@company.com" value="neha@acme.com"><div id="lErr"></div>

function loginSend(){const m=$('lMail').value.trim().toLowerCase();const o=DB.organizers.find(x=>x.email===m);if(!o){$('lErr').innerHTML=`<div class="err">${ic('alert')}<span>No organizer account for this email. Buy a game first – the account is created at checkout.</span></div>`;return}
  LOGIN={o,code:String(100000+rnd(899999))};sheet(`<div class="eyebrow">Check your inbox</div><h2>Enter the 6-digit code</h2><p class="muted small">Sent to ${esc(m)}.</p><input class="inp mono" id="lCode" inputmode="numeric" maxlength="6" placeholder="••••••" style="font-size:22px;letter-spacing:.3em;text-align:center"><div id="lErr"></div>
  <button class="btn block" style="margin-top:14px" onclick="loginVerify()">Sign in</button><p class="proto">Prototype: the code is <b class="mono">${LOGIN.code}</b></p>`)}
function loginVerify(){if($('lCode').value.trim()!==LOGIN.code){$('lErr').innerHTML=`<div class="err">${ic('alert')}<span>That code is not right.</span></div>`;return}DB.session={orgId:LOGIN.o.id};closeSheet();const g=DB.games.find(x=>x.orgId===LOGIN.o.id&&x.status!=='purged')||DB.games.find(x=>x.orgId===LOGIN.o.id);go({mode:'console',role:'org',gid:g?g.id:null})}
